<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Écran maison</title>
<!--
  ÉCRAN MAISON — page d'affichage pour vieille tablette (Android 5+)
  JavaScript "ancien" (ES5) et CSS simple, pour les vieux moteurs web.
  Météo : Open-Meteo (gratuit, sans clé).
  RÉGLAGES : modifiez uniquement le bloc CONFIG dans le script.
  Aperçu avec des données fictives : ajoutez #demo à la fin de l'adresse.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0b1026;
    color: #fff;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #ciel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  #etoiles { position: fixed; top: 0; left: 0; right: 0; height: 70%; opacity: 0; -webkit-transition: opacity 3s; transition: opacity 3s; }
  body.ciel-nuit #etoiles { opacity: 1; }
  .etoile { position: absolute; width: 2px; height: 2px; border-radius: 1px; background: #fff; }
  #voile { position: fixed; left: 0; right: 0; bottom: 0; height: 45%;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,0.35));
    background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.35)); }

  .page {
    position: relative;
    display: -webkit-box; display: -webkit-flex; display: flex;
    height: 100%; box-sizing: border-box;
    padding: 5vh 4.5vw 4vh;
    -webkit-transition: opacity 2s; transition: opacity 2s;
  }
  body.attenue .page { opacity: 0.55; }
  .col {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    min-width: 0;
  }
  .gauche { -webkit-box-flex: 11; -webkit-flex: 11; flex: 11; padding-right: 3.5vw; }
  .droite { -webkit-box-flex: 10; -webkit-flex: 10; flex: 10; }
  .pousse { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }

  .etiquette {
    font-size: 1.9vh; font-weight: 500; letter-spacing: 0.22em;
    text-transform: uppercase; opacity: 0.6;
  }

  /* Horloge */
  .heure { font-size: 21vh; font-weight: 100; line-height: 0.9; letter-spacing: -0.03em; margin-left: -0.6vw; }
  .heure .deuxpoints { opacity: 0.55; margin: 0 0.3vw; }
  .date { font-size: 4.8vh; font-weight: 300; margin-top: 1.6vh; }
  .date:first-letter { text-transform: uppercase; }
  .sousdate { font-size: 2.3vh; font-weight: 300; opacity: 0.6; margin-top: 1vh; letter-spacing: 0.02em; }

  /* Cartes "verre" */
  .carte {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 1.8vh 2vw;
  }
  .fete { margin-top: 2.2vh; }
  .fete .nom { font-size: 4vh; font-weight: 300; margin-top: 0.6vh; }

  .ephem { margin-top: 1.6vh; }
  .ephem .rangee {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  }
  .soleil { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .soleil svg { display: block; width: 100%; height: 10vh; }
  .heures-soleil {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    font-size: 2.4vh; font-weight: 300; margin-top: 0.6vh;
  }
  .heures-soleil b { font-weight: 400; }
  .heures-soleil .milieu { opacity: 0.65; }
  .separe { width: 1px; align-self: stretch; -webkit-align-self: stretch; background: rgba(255,255,255,0.14); margin: 0 2vw; }
  .lune { text-align: center; width: 13vw; }
  .lune svg { display: block; width: 7.5vh; height: 7.5vh; margin: 0 auto; }
  .lune .phase { font-size: 2.1vh; font-weight: 300; margin-top: 1vh; line-height: 1.25; }
  .lune .pct { font-size: 1.8vh; opacity: 0.6; }

  /* Collecte des déchets */
  .collecte { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.2vh; }
  .collecte .crow { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    padding: 0.45vh 0; }
  .collecte .crow:first-of-type { padding-top: 0.7vh; }
  .collecte .cquand { font-size: 2vh; font-weight: 300; }
  .collecte .crow.first .cquand { font-weight: 500; }
  .collecte .cjour { width: 40%; font-size: 2vh; font-weight: 300; }
  .collecte .crow.first .cjour { font-weight: 500; }
  .collecte .soir { font-size: 1.7vh; font-weight: 400; color: #ffd36b; margin-left: 0.6vw; }
  .collecte .cbacs { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .collecte .bac { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    font-size: 1.9vh; font-weight: 300; margin-right: 1.4vw; }
  .collecte .bac svg { width: 2.7vh; height: 2.7vh; margin-right: 0.4vw; }

  /* Musique en cours (Sonos) */
  .sonos { margin-top: 1.6vh; display: none; padding: 1.6vh 1.6vw; }
  body.musique .sonos { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  body.musique .ephem { display: none; }
  .sonos .pochette { width: 16vh; height: 16vh; border-radius: 12px; -webkit-flex-shrink: 0; flex-shrink: 0;
    background: rgba(255,255,255,0.12) center/cover no-repeat; margin-right: 1.8vw;
    box-shadow: 0 0.6vh 2vh rgba(0,0,0,0.35); position: relative; }
  .sonos .pochette svg { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; opacity: 0.5; }
  .sonos .texte { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; }
  .sonos .titre { font-size: 3vh; font-weight: 400; margin-top: 0.5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sonos .artiste { font-size: 2.2vh; font-weight: 300; opacity: 0.7; margin-top: 0.2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sonos .barre { height: 0.45vh; border-radius: 1vh; background: rgba(255,255,255,0.16); margin-top: 1vh; overflow: hidden; }
  .sonos .barre i { display: block; height: 100%; width: 0; background: rgba(255,255,255,0.75); border-radius: 1vh; }
  .sonos .commandes { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-top: 1.2vh; }
  .sonos button { -webkit-appearance: none; appearance: none; border: 0; padding: 0; margin: 0 0.9vw 0 0; outline: none;
    width: 5.6vh; height: 5.6vh; border-radius: 50%; background: rgba(255,255,255,0.13); color: #fff;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-transition: -webkit-transform 0.12s, background 0.12s; transition: transform 0.12s, background 0.12s; }
  .sonos button svg { display: block; width: 44%; height: 44%; margin: 0 auto; fill: currentColor; }
  .sonos button.lecture { width: 7vh; height: 7vh; background: #fff; color: #0b1026; }
  .sonos button:active { -webkit-transform: scale(0.88); transform: scale(0.88); background: rgba(255,255,255,0.3); }
  .sonos button.lecture:active { background: #d8dcf0; }
  .sonos .vol { margin-left: auto; display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .sonos .vol button { margin: 0; width: 4.8vh; height: 4.8vh; }
  .sonos .vol span { font-size: 2.3vh; font-weight: 300; min-width: 4.6vh; text-align: center; }
  .sonos.attente .commandes, .sonos.attente .pochette { opacity: 0.6; }

  /* Météo */
  .actuel {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    margin-top: 0.8vh;
  }
  .grande-icone svg { display: block; width: 17vh; height: 17vh; }
  .temp { font-size: 18vh; font-weight: 100; line-height: 1; margin-left: 1.5vw; letter-spacing: -0.03em; }
  .temp sup { font-size: 7.5vh; font-weight: 200; vertical-align: top; position: relative; top: 2vh; margin-left: 0.3vw; }
  .desc { font-size: 4.2vh; font-weight: 300; margin-top: 0.3vh; }
  .alerte { display: inline-block; vertical-align: middle; font-size: 2.1vh; font-weight: 400;
    color: #ffe1b0; background: rgba(255,150,40,0.30); border-radius: 100px;
    padding: 0.6vh 1.2vw; margin-left: 1vw; position: relative; top: -0.4vh; }
  .alerte b { font-weight: 600; }
  .pastilles { margin-top: 1.6vh; }

  /* Pluie dans les 2 heures */
  .pluie-h { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-top: 0.4vh; }
  .pluie-h .barres { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: end; -webkit-align-items: flex-end; align-items: flex-end;
    height: 3.6vh; margin-right: 1.2vw; }
  .pluie-h .b { display: block; width: 0.7vw; margin-right: 0.3vw; border-radius: 2px; background: rgba(255,255,255,0.22); }
  .pluie-h .b.on { background: #8fc6ff; }
  .pluie-h .txt { font-size: 2.3vh; font-weight: 300; }
  .pluie-h .dans { opacity: 0.65; }

  /* Encadré d'infos qui défile */
  .infos { margin-top: 1.8vh; position: relative; }
  .infos .points { position: absolute; right: 2vw; top: 2.1vh; }
  .infos .pt { display: inline-block; width: 0.8vh; height: 0.8vh; border-radius: 50%;
    background: rgba(255,255,255,0.28); margin-left: 0.6vh; }
  .infos .pt.on { background: #fff; }
  .infos .contenu { min-height: 10.5vh; -webkit-transition: opacity 0.45s; transition: opacity 0.45s; }
  .infos .contenu.cache { opacity: 0; }
  .infos .grand { font-size: 3.5vh; font-weight: 300; margin-top: 0.7vh; line-height: 1.2; }
  .infos .petit { font-size: 2.1vh; font-weight: 300; opacity: 0.72; margin-top: 0.6vh; line-height: 1.3; }
  .tag { display: inline-block; font-size: 1.9vh; font-weight: 500; padding: 0.3vh 0.9vw;
    border-radius: 100px; margin-left: 0.8vw; vertical-align: middle; position: relative; top: -0.3vh; }
  .tag.v { background: rgba(95,211,141,0.30); color: #c9f5d9; }
  .tag.n { background: rgba(255,255,255,0.18); }
  .tag.d { background: rgba(255,107,90,0.30); color: #ffd0c9; }

  /* Anniversaire du jour (en petit, sous la fête) */
  .fete .sous { font-size: 2.2vh; color: #ffd36b; margin-top: 0.6vh; }
  .fete .sous:empty { display: none; }
  .pastille {
    display: inline-block;
    font-size: 2.2vh; font-weight: 300;
    background: rgba(255,255,255,0.10);
    border-radius: 100px; padding: 0.9vh 1.4vw; margin: 0 0.8vw 1vh 0;
  }
  .pastille b { font-weight: 500; }

  .prev {
    display: -webkit-box; display: -webkit-flex; display: flex;
    margin-top: 1.6vh;
  }
  .jour { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; text-align: center; margin-right: 1.2vw; padding: 2vh 0.5vw; }
  .jour:last-child { margin-right: 0; }
  .jour .nom { font-size: 2.3vh; font-weight: 400; opacity: 0.75; }
  .jour .nom:first-letter { text-transform: uppercase; }
  .jour svg { display: block; width: 7vh; height: 7vh; margin: 0.8vh auto 0.5vh; }
  .jour .max { font-size: 3.8vh; font-weight: 300; }
  .jour .min { font-size: 2.6vh; font-weight: 300; opacity: 0.55; margin-left: 0.4vw; }
  .jour .pluie { font-size: 1.9vh; margin-top: 0.6vh; color: #a9d4ff; }

  .etat { font-size: 1.6vh; opacity: 0.4; margin-top: 1.6vh; text-align: right; }
  .erreur { color: #ffb3a6; opacity: 1; }
</style>
</head>
<body>
<div id="ciel"></div>
<div id="etoiles"></div>
<div id="voile"></div>

<div class="page">
  <div class="col gauche">
    <div class="heure" id="heure">--:--</div>
    <div class="date" id="date"></div>
    <div class="sousdate" id="sousdate"></div>

    <div class="carte fete" id="fete-carte">
      <div class="etiquette" id="fete-titre">Bonne fête</div>
      <div class="nom" id="fete"></div>
      <div class="sous" id="fete-sous"></div>
    </div>

    <div class="carte collecte">
      <div class="etiquette">Collecte des déchets</div>
      <div id="collecte"></div>
    </div>

    <div class="pousse"></div>


    <div class="carte sonos" id="sonos">
      <div class="pochette" id="sonos-pochette"></div>
      <div class="texte">
        <div class="etiquette" id="sonos-piece">En écoute</div>
        <div class="titre" id="sonos-titre"></div>
        <div class="artiste" id="sonos-artiste"></div>
        <div class="barre"><i id="sonos-barre"></i></div>
        <div class="commandes">
          <button onclick="cmdSonos('prev')" aria-label="Titre précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
          <button class="lecture" id="sonos-lecture" onclick="cmdSonos('basculer')" aria-label="Lecture ou pause"></button>
          <button onclick="cmdSonos('next')" aria-label="Titre suivant"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z"/></svg></button>
          <div class="vol">
            <button onclick="cmdSonos('voldown')" aria-label="Baisser le volume"><svg viewBox="0 0 24 24"><path d="M5 10.8h14v2.4H5z"/></svg></button>
            <span id="sonos-vol"></span>
            <button onclick="cmdSonos('volup')" aria-label="Monter le volume"><svg viewBox="0 0 24 24"><path d="M10.8 5h2.4v5.8H19v2.4h-5.8V19h-2.4v-5.8H5v-2.4h5.8z"/></svg></button>
          </div>
        </div>
      </div>
    </div>
    <div class="carte ephem">
      <div class="rangee">
        <div class="soleil">
          <div id="arc"></div>
          <div class="heures-soleil">
            <span>&#8593; <b id="lever">--</b></span>
            <span class="milieu" id="duree"></span>
            <span><b id="coucher">--</b> &#8595;</span>
          </div>
        </div>
        <div class="separe"></div>
        <div class="lune">
          <div id="lune-svg"></div>
          <div class="phase" id="lune-nom"></div>
          <div class="pct" id="lune-pct"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="col droite">
    <div class="etiquette" id="lieu"></div>
    <div class="actuel">
      <div class="grande-icone" id="icone"></div>
      <div class="temp" id="temp"></div>
    </div>
    <div class="desc" id="desc">Chargement de la météo…</div>
    <div class="pastilles" id="details"></div>
    <div class="pluie-h" id="pluie"></div>

    <div class="carte infos">
      <div class="etiquette" id="infos-titre"></div>
      <div class="points" id="infos-points"></div>
      <div class="contenu" id="infos-contenu"></div>
    </div>

    <div class="pousse"></div>

    <div class="etiquette">Prochains jours</div>
    <div class="prev" id="prev"></div>
    <div class="etat" id="etat"></div>
  </div>
</div>

  if (c === 2) return ["Éclaircies", "eclaircie", "eclaircie-nuit", false];
  if (c === 3) return ["Ciel couvert", "nuage", "nuage", true];
  if (c === 45 || c === 48) return ["Brouillard", "brouillard", "brouillard", true];
  if (c === 51 || c === 53 || c === 55) return ["Bruine", "pluie", "pluie", true];
  if (c === 56 || c === 57) return ["Bruine verglaçante", "pluie", "pluie", true];
  if (c === 61) return ["Pluie faible", "pluie", "pluie", true];

  if (c === 75) return ["Forte neige", "neige", "neige", true];

              [23.99, "Dernier quartier"], [27.68, "Dernier croissant"], [99, "Nouvelle lune"]];

    if (data) { try { ok(data); } catch (e) {} } else if (ko) { ko(); }
  };

}

/* ---------- Météo (Open-Meteo) ---------- */
var JR = 1; // dans les tableaux "daily", l'indice 0 est la veille, 1 aujourd'hui
var etatJour = { hier: 0, aujourdhui: 0 };

function chargerMeteo() {
  if (location.hash === "#demo") { afficherMeteo(donneesDemo()); return; }
  var url = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + CONFIG.latitude + "&longitude=" + CONFIG.longitude +
    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&minutely_15=precipitation&forecast_minutely_15=9" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,wind_gusts_10m_max" +
    "&past_days=1&timezone=Europe%2FParis&forecast_days=" + (CONFIG.joursPrevision + 1);
  chargerJSON(url, function (m) {
    afficherMeteo(m);
    setTimeout(chargerMeteo, CONFIG.rafraichirMinutes * 60000);
  }, erreurMeteo);
}
function erreurMeteo() {
  el("etat").innerHTML = '<span class="erreur">Météo indisponible · nouvel essai dans 2 min</span>';
  setTimeout(chargerMeteo, 120000);
}

var pastillesMeteo = "";
function majPastilles() {
  var p = "";
  if (etatInterieur && etatInterieur.length) {
    var s = 0;
    for (var i = 0; i < etatInterieur.length; i++) s += etatInterieur[i].temp;
    p += '<span class="pastille">Intérieur <b>' + (Math.round(s / etatInterieur.length * 10) / 10).toString().replace(".", ",") + '°</b></span>';
  }
  el("details").innerHTML = p + pastillesMeteo;
}

function afficherMeteo(m) {
  var c = m.current, d = m.daily, o = JR;
  var maintenant = new Date(), h = maintenant.getHours();

  etatSoleil.lever = minutesISO(d.sunrise[o]);
  etatSoleil.coucher = minutesISO(d.sunset[o]);
  etatSoleil.connu = true;
  etatJour.aujourdhui = etatSoleil.coucher - etatSoleil.lever;
  etatJour.hier = minutesISO(d.sunset[o - 1]) - minutesISO(d.sunrise[o - 1]);

  var mn = minutesMaintenant(maintenant);
  var faitNuit = mn < etatSoleil.lever || mn > etatSoleil.coucher;
  var info = meteoInfo(c.weather_code);
  couvert = info[3];

  // Alertes : gel et rafales
  var al = "";
  var minDemain = d.temperature_2m_min[o + 1], minAuj = d.temperature_2m_min[o];
  if (h >= 14 && minDemain !== undefined && minDemain <= 0.5) al += '<span class="alerte">Gel cette nuit · <b>' + Math.round(minDemain) + '°</b></span>';
  else if (h < 11 && minAuj <= 0.5) al += '<span class="alerte">Gel ce matin · <b>' + Math.round(minAuj) + '°</b></span>';
  var raf = d.wind_gusts_10m_max ? d.wind_gusts_10m_max[o] : 0;
  if (raf >= 60) al += '<span class="alerte">Rafales <b>' + Math.round(raf) + ' km/h</b></span>';

  el("lieu").innerHTML = CONFIG.nomLieu + " &nbsp;·&nbsp; maintenant";
  el("icone").innerHTML = svgIcone(faitNuit ? info[2] : info[1]);
  el("temp").innerHTML = Math.round(c.temperature_2m) + "<sup>°</sup>";
  el("desc").innerHTML = info[0] + al;
  pastillesMeteo =
    '<span class="pastille">Ressenti <b>' + Math.round(c.apparent_temperature) + '°</b></span>' +
    '<span class="pastille">Humidité <b>' + Math.round(c.relative_humidity_2m) + ' %</b></span>' +
    '<span class="pastille">Vent <b>' + Math.round(c.wind_speed_10m) + ' km/h</b></span>';
  majPastilles();
  afficherPluie(m.minutely_15);

  var html = "";
  for (var i = o + 1; i < d.time.length && i <= o + CONFIG.joursPrevision; i++) {
    var j = jourISO(d.time[i]);
    var inf = meteoInfo(d.weather_code[i]);
    var pluie = d.precipitation_probability_max ? d.precipitation_probability_max[i] : null;
    html += '<div class="carte jour">' +
      '<div class="nom">' + (i === o + 1 ? "demain" : JOURS[j.getDay()]) + '</div>' +
      svgIcone(inf[1]) +
      '<div><span class="max">' + Math.round(d.temperature_2m_max[i]) + '°</span>' +
      '<span class="min">' + Math.round(d.temperature_2m_min[i]) + '°</span></div>' +
      (pluie !== null && pluie !== undefined && pluie >= 20 ? '<div class="pluie">pluie ' + pluie + ' %</div>' : '<div class="pluie">&nbsp;</div>') +
      '</div>';
  }
  el("prev").innerHTML = html;

  el("etat").innerHTML = "Mis à jour à " + deux(maintenant.getHours()) + "h" + deux(maintenant.getMinutes());
  dernierCiel = "";
  derniereMinute = -1;
  majHorloge();
  construireInfos();
}

/* ---------- Pluie dans les 2 prochaines heures ---------- */
function afficherPluie(mm) {
  var z = el("pluie");
  if (!mm || !mm.time) { z.innerHTML = ""; return; }
  var now = new Date().getTime(), t = [], v = [], i;
  for (i = 0; i < mm.time.length && t.length < 8; i++) {
    var d = parseISO(mm.time[i]);
    if (d.getTime() + 15 * 60000 <= now) continue;
    t.push(d); v.push(mm.precipitation[i] || 0);
  }
  if (!v.length) { z.innerHTML = ""; return; }
  var SEUIL = 0.1, max = 0.6, txt;
  for (i = 0; i < v.length; i++) if (v[i] > max) max = v[i];
  if (v[0] >= SEUIL) {
    var fin = -1;
    for (i = 1; i < v.length; i++) if (v[i] < SEUIL) { fin = i; break; }
    txt = fin < 0 ? "Il pleut, et ça va durer au moins 2 h" : "Il pleut, jusque vers " + hm(t[fin]);
  } else {
    var deb = -1;
    for (i = 1; i < v.length; i++) if (v[i] >= SEUIL) { deb = i; break; }
    txt = deb < 0 ? "Pas de pluie dans les 2 prochaines heures"
                  : "Pluie vers " + hm(t[deb]) + ' <span class="dans">· dans ' +
                    Math.max(5, Math.round((t[deb].getTime() - now) / 300000) * 5) + " min</span>";
  }
  var b = "";
  for (i = 0; i < v.length; i++) {
    var on = v[i] >= SEUIL;
    b += '<span class="b' + (on ? ' on' : '') + '" style="height:' + (on ? Math.max(25, Math.round(v[i] / max * 100)) : 12) + '%"></span>';
  }
  z.innerHTML = '<span class="barres">' + b + '</span><span class="txt">' + txt + '</span>';
}

/* ---------- Football (TheSportsDB) ---------- */
var etatFoot = null;
function chargerFoot() {
  if (!CONFIG.equipe) return;
  if (location.hash === "#demo") { etatFoot = footDemo(); construireInfos(); return; }
  var base = "https://www.thesportsdb.com/api/v1/json/123/", res = { dernier: null, prochain: null }, n = 0;
  function fini() { n++; if (n === 2) { etatFoot = res; construireInfos(); } }
  chargerJSON(base + "eventslast.php?id=" + CONFIG.equipe.id, function (a) {
    res.dernier = extremeMatch(a.results, true); fini();
  }, fini);
  chargerJSON(base + "eventsnext.php?id=" + CONFIG.equipe.id, function (a) {
    res.prochain = extremeMatch(a.events, false); fini();
  }, fini);
  setTimeout(chargerFoot, 30 * 60000);
}
function dateMatch(e) {
  var s = e.strTimestamp || ((e.dateEvent || "") + "T" + (e.strTime || "00:00:00"));
  if (!s || s.length < 16) return null;
  return new Date(Date.UTC(+s.substr(0, 4), +s.substr(5, 2) - 1, +s.substr(8, 2), +s.substr(11, 2), +s.substr(14, 2)));
}
function extremeMatch(l, plusRecent) {
  var best = null, bd = null;
  if (!l) return null;
  for (var i = 0; i < l.length; i++) {
    var d = dateMatch(l[i]);
    if (!d) continue;
    if (!best || (plusRecent ? d > bd : d < bd)) { best = l[i]; bd = d; }
  }
  return best;
}
function nomEquipe(n) { return CONFIG.equipe && n === CONFIG.equipe.nom ? CONFIG.equipe.court : (n || "").replace(/^(AS|FC|OGC|RC|AJ|SCO|ESTAC) /, ""); }
function nomCompet(n) {
  var M = { "French Ligue 1": "Ligue 1", "UEFA Champions League": "Ligue des champions",
            "Coupe de France": "Coupe de France", "French Coupe de France": "Coupe de France",
            "Trophée des Champions": "Trophée des champions", "UEFA Super Cup": "Supercoupe d'Europe",
            "FIFA Club World Cup": "Coupe du monde des clubs", "Club Friendlies": "Match amical" };
  return M[n] || n || "";
}
function slideFoot(f, now) {
  var court = CONFIG.equipe.court, s = { titre: court, grand: "", petit: "" };
  var p = f.prochain, pd = p ? dateMatch(p) : null;
  var lignePro = "";
  if (p && pd) {
    var nj = joursEntre(now, pd);
    var quand = nj === 0 ? "ce soir " + hm(pd) : nj === 1 ? "demain " + hm(pd) : JOURS[pd.getDay()].substr(0, 3) + ". " + pd.getDate() + " " + MOISCOURT[pd.getMonth()] + " " + hm(pd);
    if (nj === 0 && pd.getHours() < 18) quand = "aujourd'hui " + hm(pd);
    lignePro = nomEquipe(p.strHomeTeam) + " – " + nomEquipe(p.strAwayTeam) + " · " + quand;
    if (nj === 0 && pd.getTime() > now.getTime() - 2 * 3600000) {   // match du jour : on le met en avant
      s.titre = court + " · match " + (pd.getHours() >= 18 ? "ce soir" : "aujourd'hui");
      s.grand = nomEquipe(p.strHomeTeam) + " – " + nomEquipe(p.strAwayTeam) + " · " + hm(pd);
      s.petit = nomCompet(p.strLeague);
      return s;
    }
  }
  var d = f.dernier;
  if (d && d.intHomeScore !== null && d.intHomeScore !== "" && d.intAwayScore !== null) {
    var hs = +d.intHomeScore, as = +d.intAwayScore, dom = d.strHomeTeam === CONFIG.equipe.nom;
    var nous = dom ? hs : as, eux = dom ? as : hs;
    var tag = nous > eux ? '<span class="tag v">Victoire</span>' : nous < eux ? '<span class="tag d">Défaite</span>' : '<span class="tag n">Nul</span>';
    var dd = dateMatch(d);
    s.titre = court + " · dernier match";
    s.grand = nomEquipe(d.strHomeTeam) + " " + hs + " – " + as + " " + nomEquipe(d.strAwayTeam) + tag;
    s.petit = nomCompet(d.strLeague) + (dd ? " · " + dateLongue(dd) : "") + (lignePro ? "<br>Prochain : " + lignePro : "");
    return s;
  }
  if (lignePro) { s.titre = court + " · prochain match"; s.grand = lignePro.split(" · ")[0]; s.petit = lignePro.split(" · ").slice(1).join(" · "); return s; }
  return null;
}

/* ---------- Calendriers : vacances scolaires (zone C) et jours fériés ---------- */
var VACANCES = [ // [nom, premier jour de vacances, jour de reprise] — calendrier officiel 2026-2027, zone C
  ["de la Toussaint", "2026-10-17", "2026-11-02"],
  ["de Noël",         "2026-12-19", "2027-01-04"],
  ["d'hiver",         "2027-02-06", "2027-02-22"],
  ["de printemps",    "2027-04-03", "2027-04-19"],
  ["d'été",           "2027-07-03", null]
];
function paques(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function feries(y) {
  var p = paques(y);
  function j(m, d) { return new Date(y, m - 1, d); }
  function pp(n) { return new Date(p.getFullYear(), p.getMonth(), p.getDate() + n); }
  var l = [[j(1, 1), "Jour de l'An"], [pp(1), "Lundi de Pâques"], [j(5, 1), "Fête du Travail"],
           [j(5, 8), "Victoire 1945"], [pp(39), "Ascension"], [pp(50), "Lundi de Pentecôte"],
           [j(7, 14), "Fête nationale"], [j(8, 15), "Assomption"], [j(11, 1), "Toussaint"],
           [j(11, 11), "Armistice"], [j(12, 25), "Noël"]];
  l.sort(function (a, b) { return a[0] - b[0]; });
  return l;
}
function slideFerie(auj) {
  var l = feries(auj.getFullYear()).concat(feries(auj.getFullYear() + 1));
  for (var i = 0; i < l.length; i++) {
    if (l[i][0] < auj) continue;
    var d = l[i][0], n = joursEntre(auj, d), jw = d.getDay();
    var pont = (jw === 2 || jw === 4) ? " · pont possible" : (jw === 0 || jw === 6) ? " · tombe un week-end" : "";
    return { titre: "Prochain jour férié",
             grand: n === 0 ? "Aujourd'hui : " + l[i][1] : l[i][1] + " " + dansJours(n),
             petit: dateLongue(d) + pont };
  }
  return null;
}
function slideVacances(auj) {
  for (var i = 0; i < VACANCES.length; i++) {
    var v = VACANCES[i], deb = dateYMD(v[1]), fin = v[2] ? dateYMD(v[2]) : null;
    if (fin && auj >= fin) continue;
    if (auj >= deb) {
      return { titre: "Vacances scolaires · zone C", grand: "Vacances " + v[0],
               petit: fin ? "Reprise " + dateLongue(fin) + " · encore " + joursEntre(auj, fin) + " jours" : "Bonnes vacances !" };
    }
    return { titre: "Vacances scolaires · zone C", grand: "Vacances " + v[0] + " " + dansJours(joursEntre(auj, deb)),
             petit: "Du " + dateLongue(deb) + (fin ? " au " + dateLongue(fin) : "") };
  }
  return null;
}

/* ---------- Anniversaires et événements ---------- */
function listeAnniv() {
  var l = CONFIG.anniversaires || [];
  if (!l.length && location.hash === "#demo") {
    var d = new Date();
    l = [{ nom: "Marie", date: d.getDate() + "/" + (d.getMonth() + 1), annee: 1985 }];
  }
  return l;
}
function prochainsAnniv(auj) {
  var src = listeAnniv(), l = [];
  for (var i = 0; i < src.length; i++) {
    var p = src[i].date.split("/"), jj = +p[0], mm = +p[1];
    var d = new Date(auj.getFullYear(), mm - 1, jj);
    if (d < auj) d = new Date(auj.getFullYear() + 1, mm - 1, jj);
    l.push({ nom: src[i].nom, date: d, n: joursEntre(auj, d), age: src[i].annee ? d.getFullYear() - src[i].annee : null });
  }
  l.sort(function (a, b) { return a.n - b.n; });
  return l;
}
function annivDuJour(d) {
  var auj = new Date(d.getFullYear(), d.getMonth(), d.getDate()), l = prochainsAnniv(auj), r = [];
  for (var i = 0; i < l.length; i++) if (l[i].n === 0) r.push(l[i].nom + (l[i].age ? " (" + l[i].age + " ans)" : ""));
  return r;
}
function slideEvenement(auj) {
  var l = CONFIG.evenements || [], best = null;
  for (var i = 0; i < l.length; i++) {
    var p = l[i].date.split("/"), d = new Date(+p[2], +p[1] - 1, +p[0]);
    if (d < auj) continue;
    if (!best || d < best.d) best = { nom: l[i].nom, d: d };
  }
  if (!best) return null;
  return { titre: "À venir", grand: best.nom + " " + dansJours(joursEntre(auj, best.d)), petit: dateLongue(best.d) };
}

/* ---------- Air, durée du jour, intérieur ---------- */
function slideAir() {
  var a = etatAir.aqi, lab, col;
  if (a === null || a === undefined) return null;
  if (a <= 20) { lab = "Très bonne"; col = "#7fe0a6"; } else if (a <= 40) { lab = "Bonne"; col = "#b6e07a"; }
  else if (a <= 60) { lab = "Moyenne"; col = "#f5d24a"; } else if (a <= 80) { lab = "Médiocre"; col = "#ffaa55"; }
  else if (a <= 100) { lab = "Mauvaise"; col = "#ff7b6b"; } else { lab = "Très mauvaise"; col = "#e08bff"; }
  var conseil = a <= 40 ? "aucune précaution particulière" : a <= 60 ? "les personnes sensibles peuvent limiter l'effort dehors"
              : "éviter les efforts intenses en extérieur";
  return { titre: "Qualité de l'air", grand: '<span style="color:' + col + '">' + lab + "</span> qualité de l'air",
           petit: "Indice européen " + Math.round(a) + " · " + conseil };
}
function slideJour(auj) {
  var delta = etatJour.aujourdhui - etatJour.hier, y = auj.getFullYear();
  var hiv = new Date(y, 11, 21), ete = new Date(y, 5, 21);
  if (auj > hiv) hiv = new Date(y + 1, 11, 21);
  if (auj > ete) ete = new Date(y + 1, 5, 21);
  var sol = hiv < ete ? ["solstice d'hiver", hiv] : ["solstice d'été", ete];
  var nSol = joursEntre(auj, sol[1]);
  var grand = delta < 0 ? "Les jours raccourcissent" : delta > 0 ? "Les jours rallongent" : "Durée du jour stable";
  var dt = delta !== 0 ? (delta > 0 ? "+" : "−") + Math.abs(delta) + " min de jour par rapport à hier · " : "";
  return { titre: "Lumière du jour", grand: grand,
           petit: dt + (nSol === 0 ? "c'est le " + sol[0] + " !" : sol[0] + " " + dansJours(nSol)) };
}
function slideInterieur() {
  function f(v) { return (Math.round(v * 10) / 10).toString().replace(".", ",") + "°"; }
  var l = etatInterieur, r = [], c = [];
  for (var i = 0; i < l.length; i++) {
    r.push((l.length > 1 ? l[i].nom + " " : "") + f(l[i].temp));
    if (l[i].consigne !== null && l[i].consigne !== undefined) c.push((l.length > 1 ? l[i].nom + " " : "") + f(l[i].consigne));
  }
  return { titre: "Dans la maison", grand: r.slice(0, 3).join(" · "),
           petit: c.length ? "Consigne du chauffage : " + c.slice(0, 3).join(" · ") : "" };
}

/* ---------- Encadré qui fait défiler les infos ---------- */
var SLIDES = [], idxSlide = 0;
function construireInfos() {
  var now = new Date(), auj = new Date(now.getFullYear(), now.getMonth(), now.getDate()), s = [], x;
  function ajoute(v) { if (v) s.push(v); }
  if (etatFoot) ajoute(slideFoot(etatFoot, now));
  if (etatInterieur && etatInterieur.length) ajoute(slideInterieur());
  ajoute(slideEvenement(auj));
  ajoute(slideVacances(auj));
  ajoute(slideFerie(auj));
  if (etatAir) ajoute(slideAir());
  if (etatJour.aujourdhui) ajoute(slideJour(auj));
  SLIDES = s;
  if (idxSlide >= s.length) idxSlide = 0;
  afficherSlide();
}
function afficherSlide() {
  if (!SLIDES.length) return;
  var s = SLIDES[idxSlide], pts = "";
  el("infos-titre").innerHTML = s.titre;
  el("infos-contenu").innerHTML = '<div class="grand">' + s.grand + '</div>' + (s.petit ? '<div class="petit">' + s.petit + '</div>' : "");
  for (var i = 0; i < SLIDES.length; i++) pts += '<span class="pt' + (i === idxSlide ? ' on' : '') + '"></span>';
  el("infos-points").innerHTML = pts;
}
function tourner() {
  if (SLIDES.length < 2) return;
  var c = el("infos-contenu");
  c.className = "contenu cache";
  setTimeout(function () {
    idxSlide = (idxSlide + 1) % SLIDES.length;
    afficherSlide();
    c.className = "contenu";
  }, 450);
}

      temperature_2m_max: [9, 8, 10, 9, 7], temperature_2m_min: [3, 2, -1, 5, 0],

      precipitation_probability_max: [20, 10, 80, 30, 5],

    }

/* ---------- Musique en cours (Sonos, via le relais du NAS sur le port 8099) ----------
   La tuile remplace l'éphéméride pendant la lecture, et jusqu'à 15 min après une pause. */
var SVG_LECTURE = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>';
var SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>';
var SVG_NOTE = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V7h7V3z"/></svg>';
var sonosGroupe = null, sonosRecu = 0, sonosDernierJeu = 0, sonosMinuteur = null, sonosPochette = null, sonosOccupe = 0;
function urlSonos() {
  if (CONFIG.sonos === false) return null;
  if (CONFIG.sonos) return CONFIG.sonos;
  if (location.protocol === "file:") return null;
  return location.protocol + "//" + location.hostname + ":8099";
}
function enLecture(g) { return g && (g.etat === "PLAYING" || g.etat === "TRANSITIONING"); }
function choisirGroupe(l) {
  var i, g = null;
  for (i = 0; i < l.length; i++) if (enLecture(l[i])) return l[i];
  if (sonosGroupe) for (i = 0; i < l.length; i++) if (l[i].id === sonosGroupe.id) g = l[i];
  return g;
}
function afficherSonos() {
  var g = sonosGroupe, now = new Date().getTime();
  if (enLecture(g)) sonosDernierJeu = now;
  var visible = g && g.titre && (enLecture(g) || now - sonosDernierJeu < 15 * 60000);
  document.body.className = document.body.className.replace(/\s*musique/g, "") + (visible ? " musique" : "");
  if (!visible) return;
  document.getElementById("sonos-piece").innerHTML = (enLecture(g) ? "En écoute" : "En pause") + " · " + echap(g.nom);
  document.getElementById("sonos-titre").innerHTML = echap(g.titre);
  document.getElementById("sonos-artiste").innerHTML = echap(g.artiste + (g.album && g.artiste ? " — " + g.album : g.album || ""));
  document.getElementById("sonos-lecture").innerHTML = enLecture(g) ? SVG_PAUSE : SVG_LECTURE;
  document.getElementById("sonos-vol").innerHTML = g.volume === null || g.volume === undefined ? "–" : g.volume;
  var p = document.getElementById("sonos-pochette");
  if (g.pochette !== sonosPochette) {
    sonosPochette = g.pochette;
    p.style.backgroundImage = g.pochette ? "url('" + g.pochette.replace(/'/g, "%27") + "')" : "none";
    p.innerHTML = g.pochette ? "" : SVG_NOTE;
  }
  majBarreSonos();
}
function majBarreSonos() {
  var g = sonosGroupe;
  if (!g || !g.duree) { document.getElementById("sonos-barre").style.width = "0"; return; }
  var pos = g.pos + (enLecture(g) ? (new Date().getTime() - sonosRecu) / 1000 : 0);
  document.getElementById("sonos-barre").style.width = Math.min(100, pos / g.duree * 100).toFixed(1) + "%";
}
function chargerSonos() {
  clearTimeout(sonosMinuteur);
  var u = urlSonos();
  if (location.hash === "#demo") { sonosGroupe = sonosGroupe || sonosDemo(); sonosRecu = sonosRecu || new Date().getTime(); afficherSonos(); return; }
  if (!u) return;
  chargerJSON(u + "/sonos?t=" + new Date().getTime(), function (d) {
    var l = d.groupes || [], joue = false;
    for (var i = 0; i < l.length; i++) if (enLecture(l[i])) joue = true;
    sonosMinuteur = setTimeout(chargerSonos, joue ? 5000 : 20000);
    if (new Date().getTime() - sonosOccupe > 1500) {
      sonosGroupe = choisirGroupe(l); sonosRecu = new Date().getTime(); afficherSonos();
    }
  }, function () {
    sonosMinuteur = setTimeout(chargerSonos, 60000);
  });
}
function cmdSonos(a) {
  var g = sonosGroupe;
  if (!g) return;
  if (a === "basculer") a = enLecture(g) ? "pause" : "play";
  // affichage immédiat, confirmé ensuite par l'enceinte
  if (a === "pause") { g.pos += (new Date().getTime() - sonosRecu) / 1000; g.etat = "PAUSED_PLAYBACK"; }
  if (a === "play") g.etat = "PLAYING";
  if (a === "volup" && g.volume !== null) g.volume = Math.min(100, g.volume + 3);
  if (a === "voldown" && g.volume !== null) g.volume = Math.max(0, g.volume - 3);
  sonosRecu = new Date().getTime(); sonosOccupe = sonosRecu;
  afficherSonos();
  if (location.hash === "#demo") { commandeDemo(a); return; }
  var el = document.getElementById("sonos");
  el.className = "carte sonos attente";
  chargerJSON(urlSonos() + "/sonos/cmd?id=" + encodeURIComponent(g.id) + "&a=" + a + "&t=" + sonosRecu, function (e) {
    el.className = "carte sonos";
    if (e && e.id) { sonosGroupe = e; sonosRecu = new Date().getTime(); afficherSonos(); }
    clearTimeout(sonosMinuteur); sonosMinuteur = setTimeout(chargerSonos, 1500);
  }, function () { el.className = "carte sonos"; chargerSonos(); });
}
function echap(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function sonosDemo() {
  return { id: "demo", nom: "Salon + Cuisine", etat: "PLAYING", titre: "Get Lucky", artiste: "Daft Punk",
           album: "Random Access Memories", pochette: "", volume: 28, pos: 95, duree: 369 };
}
function commandeDemo(a) {
  var g = sonosGroupe;
  if (a === "next" || a === "prev") { g.titre = a === "next" ? "Midnight City" : "Get Lucky"; g.artiste = a === "next" ? "M83" : "Daft Punk"; g.pos = 0; }
  afficherSonos();
}
document.addEventListener("touchstart", function () {}, true);   // active :active sur iOS
setInterval(function () { if (sonosGroupe && enLecture(sonosGroupe)) majBarreSonos(); }, 1000);
setInterval(afficherSonos, 60000);

/* ---------- Rechargement automatique ----------
   Le relais du NAS remplace index.html quand une nouvelle version est publiée :
   la page vérifie toutes les 30 min si elle a changé et se recharge. Rechargement aussi chaque nuit à 3h. */
var signaturePage = null;
function signature(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ":" + h; }
// Recharge avec une adresse nouvelle : l'icône d'écran d'accueil d'iOS garde sinon l'ancienne page en cache.
function recharger() { location.replace(location.pathname + "?v=" + new Date().getTime() + location.hash); }
function verifierVersion() {
  if (location.protocol === "file:" || location.hash === "#demo") return;
  var x = new XMLHttpRequest();
  x.open("GET", "index.html?v=" + new Date().getTime(), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200 || x.responseText.length < 5000) return;
    var s = signature(x.responseText);
    if (signaturePage === null) signaturePage = s;
    else if (s !== signaturePage) recharger();
  };
  try { x.send(); } catch (e) {}
}
setInterval(function () {
  var d = new Date();
  if (d.getHours() === 3 && d.getMinutes() === 0 && d.getSeconds() < 2) recharger();
}, 1000);
setInterval(verifierVersion, 30 * 60000);
verifierVersion();

/* ---------- Démarrage ---------- */
creerEtoiles();
majHorloge();
setInterval(majHorloge, 1000);
setInterval(tourner, CONFIG.secondesParInfo * 1000);
chargerMeteo();
chargerAir();
chargerFoot();
chargerInterieur();
chargerSonos();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b1026">
<title>Écran maison</title>
<!--
  ÉCRAN MAISON — page d'affichage pour vieille tablette (Android 5+)
  JavaScript "ancien" (ES5) et CSS simple, pour les vieux moteurs web.
  Météo : Open-Meteo (gratuit, sans clé).
  RÉGLAGES : modifiez uniquement le bloc CONFIG dans le script.
  Aperçu avec des données fictives : ajoutez #demo à la fin de l'adresse.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0b1026;
    color: #fff;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #ciel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  #etoiles { position: fixed; top: 0; left: 0; right: 0; height: 70%; opacity: 0; -webkit-transition: opacity 3s; transition: opacity 3s; }
  body.ciel-nuit #etoiles { opacity: 1; }
  .etoile { position: absolute; width: 2px; height: 2px; border-radius: 1px; background: #fff; }
  #voile { position: fixed; left: 0; right: 0; bottom: 0; height: 45%;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,0.35));
    background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.35)); }

  .page {
    position: relative;
    display: -webkit-box; display: -webkit-flex; display: flex;
    height: 100%; box-sizing: border-box;
    padding: 5vh 4.5vw 4vh;
    -webkit-transition: opacity 2s; transition: opacity 2s;
  }
  body.attenue .page { opacity: 0.55; }
  .col {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    min-width: 0;
  }
  .gauche { -webkit-box-flex: 11; -webkit-flex: 11; flex: 11; padding-right: 3.5vw; }
  .droite { -webkit-box-flex: 10; -webkit-flex: 10; flex: 10; }
  .pousse { display: none; }
  /* alignement : la dernière tuile visible de chaque colonne s'étire jusqu'en bas */
  .col > .carte.etire { -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; }

  .etiquette {
    font-size: 1.9vh; font-weight: 500; letter-spacing: 0.22em;
    text-transform: uppercase; opacity: 0.6;
  }

  /* Horloge */
  .heure { font-size: 21vh; font-weight: 600; line-height: 0.9; letter-spacing: -0.03em; margin-left: -0.6vw; }
  .heure .deuxpoints { opacity: 0.55; margin: 0 0.3vw; }
  .date { font-size: 4.8vh; font-weight: 300; margin-top: 1.6vh; }
  .date:first-letter { text-transform: uppercase; }
  .sousdate { font-size: 2.3vh; font-weight: 300; opacity: 0.6; margin-top: 1vh; letter-spacing: 0.02em; }

  /* Cartes "verre" */
  .carte {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 1.8vh 2vw;
  }
  .fete { margin-top: 2.2vh; }
  .fete .nom { font-size: 4vh; font-weight: 300; margin-top: 0.6vh; }

  .ephem { margin-top: 1.6vh; }
  .ephem .rangee {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  }
  .soleil { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .soleil svg { display: block; width: 100%; height: 10vh; }
  .heures-soleil {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    font-size: 2.4vh; font-weight: 300; margin-top: 0.6vh;
  }
  .heures-soleil b { font-weight: 400; }
  .heures-soleil .milieu { opacity: 0.65; }
  .separe { width: 1px; align-self: stretch; -webkit-align-self: stretch; background: rgba(255,255,255,0.14); margin: 0 2vw; }
  .ephem { display: none !important; }   /* remplacée par la ligne soleil/lune sous la météo */
  .astre { font-size: 2.05vh; font-weight: 300; opacity: 0.8; margin-top: 1vh; white-space: nowrap; }
  .astre b { font-weight: 400; }
  .astre .sep { opacity: 0.45; margin: 0 0.6vw; }
  .astre svg { display: inline-block; width: 2.1vh; height: 2.1vh; vertical-align: -0.45vh; margin-right: 0.4vw; }
  .lune { position: absolute; top: 1.5vh; right: 1.8vw; font-size: 1.8vh; font-weight: 300; opacity: 0.75; white-space: nowrap; }
  .lune svg { display: inline-block; width: 2.2vh; height: 2.2vh; vertical-align: -0.5vh; margin-right: 0.5vw; }
  .lune .pct { display: none; }

  /* Collecte des déchets */
  .collecte { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.2vh; }
  .collecte .crow { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    padding: 0.45vh 0; }
  .collecte .crow:first-of-type { padding-top: 0.7vh; }
  .collecte .cquand { font-size: 2vh; font-weight: 300; }
  .collecte .crow.first .cquand { font-weight: 500; }
  .collecte .cjour { width: 40%; font-size: 2vh; font-weight: 300; }
  .collecte .crow.first .cjour { font-weight: 500; }
  .collecte .soir { font-size: 1.7vh; font-weight: 400; color: #ffd36b; margin-left: 0.6vw; }
  .collecte .cbacs { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .collecte .bac { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    font-size: 1.9vh; font-weight: 300; margin-right: 1.4vw; }
  .collecte .bac svg { width: 2.7vh; height: 2.7vh; margin-right: 0.4vw; }

  /* Musique en cours (Sonos) */
  .sonos { margin-top: 1.6vh; display: none; padding: 1.6vh 1.6vw; }
  body.musique .sonos { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .sonos .pochette { width: 16vh; height: 16vh; border-radius: 12px; -webkit-flex-shrink: 0; flex-shrink: 0;
    background: rgba(255,255,255,0.12) center/cover no-repeat; margin-right: 1.8vw;
    box-shadow: 0 0.6vh 2vh rgba(0,0,0,0.35); position: relative; }
  .sonos .pochette svg { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; opacity: 0.5; }
  .sonos .texte { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; }
  .sonos .titre { font-size: 3vh; font-weight: 400; margin-top: 0.5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sonos .artiste { font-size: 2.2vh; font-weight: 300; opacity: 0.7; margin-top: 0.2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sonos .barre { height: 0.45vh; border-radius: 1vh; background: rgba(255,255,255,0.16); margin-top: 1vh; overflow: hidden; }
  .sonos .barre i { display: block; height: 100%; width: 0; background: rgba(255,255,255,0.75); border-radius: 1vh; }
  .sonos .commandes { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-top: 1.2vh; }
  .sonos button { -webkit-appearance: none; appearance: none; border: 0; padding: 0; margin: 0 0.9vw 0 0; outline: none;
    width: 5.6vh; height: 5.6vh; border-radius: 50%; background: rgba(255,255,255,0.13); color: #fff;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-transition: -webkit-transform 0.12s, background 0.12s; transition: transform 0.12s, background 0.12s; }
  .sonos button svg { display: block; width: 44%; height: 44%; margin: 0 auto; fill: currentColor; }
  .sonos button.lecture { width: 7vh; height: 7vh; background: #fff; color: #0b1026; }
  .sonos button:active { -webkit-transform: scale(0.88); transform: scale(0.88); background: rgba(255,255,255,0.3); }
  .sonos button.lecture:active { background: #d8dcf0; }
  .sonos .vol { margin-left: auto; display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .sonos .vol button { margin: 0; width: 6.4vh; height: 6.4vh; }
  .sonos .vol button svg { width: 50%; height: 50%; }
  .sonos .vol span { font-size: 2.6vh; font-weight: 400; min-width: 5vh; text-align: center; }
  .sonos.attente .commandes, .sonos.attente .pochette { opacity: 0.6; }

  /* Tuile Foot (défilante : une diapo par équipe) */
  .foot { margin-top: 1.6vh; padding-top: 1.5vh; padding-bottom: 1.4vh; display: none; position: relative; }
  .foot.visible { display: block; }
  .foot .diapos { display: -ms-grid; display: grid; }
  .foot .diapo { grid-row: 1; grid-column: 1; min-width: 0; opacity: 0; visibility: hidden;
    -webkit-transform: translateX(2.5vw); transform: translateX(2.5vw);
    -webkit-transition: opacity 0.7s, -webkit-transform 0.7s, visibility 0s 0.7s; transition: opacity 0.7s, transform 0.7s, visibility 0s 0.7s; }
  .foot .diapo.on { opacity: 1; visibility: visible; -webkit-transform: none; transform: none;
    -webkit-transition: opacity 0.7s 0.25s, -webkit-transform 0.7s 0.25s; transition: opacity 0.7s 0.25s, transform 0.7s 0.25s; }
  .foot .points { position: absolute; right: 2vw; bottom: 2.1vh; line-height: 0; }
  .foot.plusieurs .diapo .ligne:last-child { padding-right: 4.5vw; }
  .foot .pt { display: inline-block; width: 0.8vh; height: 0.8vh; border-radius: 50%; background: rgba(255,255,255,0.28); margin: 0 0.35vh; }
  .foot .pt.on { background: #fff; }
  .ecu { display: inline-block; width: 2.6vh; height: 2.6vh; border-radius: 50%; background: #fff; margin-right: 0.6vw;
    vertical-align: -0.45vh; overflow: hidden; text-align: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ecu img { width: 80%; height: 80%; margin-top: 10%; -o-object-fit: contain; object-fit: contain; display: inline-block; vertical-align: top; }
  .ecu.droite { margin-right: 0; margin-left: 0.6vw; }
  .ecu.grand { width: 4.2vh; height: 4.2vh; margin-right: 0.9vw; }
  .foot .haut .etiquette b { font-weight: 600; }
  .foot .diapo .score { font-size: 3.1vh; }
  .foot .diapo .haut .etiquette { letter-spacing: 0.14em; }
  .foot .haut { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .foot .forme { white-space: nowrap; margin-left: 1vw; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .foot .haut .etiquette { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .foot .forme span { display: inline-block; width: 2.3vh; height: 2.3vh; line-height: 2.3vh; border-radius: 50%;
    font-size: 1.35vh; font-weight: 600; text-align: center; margin-left: 0.35vw; color: #0b1026; }
  .foot .forme .V { background: #5fd38d; } .foot .forme .N { background: #c9cbd6; } .foot .forme .D { background: #ff7b6b; }
  .foot .score { font-size: 3.4vh; font-weight: 300; margin-top: 0.7vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .score b { font-weight: 500; }
  .foot .score .quand { font-size: 2vh; opacity: 0.6; margin-left: 0.8vw; }
  .foot .ligne { font-size: 1.95vh; font-weight: 300; margin-top: 0.55vh; line-height: 1.3; opacity: 0.85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .ligne .eux { opacity: 0.6; }
  .foot .ligne svg { width: 1.8vh; height: 1.8vh; vertical-align: -0.25vh; margin-right: 0.4vw; }
  .foot .direct { color: #ff8a7a; font-weight: 600; }
  .foot .direct i { display: inline-block; width: 1vh; height: 1vh; border-radius: 50%; background: #ff5a48; margin-right: 0.5vw;
    -webkit-animation: clignote 1.4s infinite; animation: clignote 1.4s infinite; }
  @-webkit-keyframes clignote { 50% { opacity: 0.25; } } @keyframes clignote { 50% { opacity: 0.25; } }

  /* Panneau Lumières & volets (Delta Dore) */
  #btn-maison { position: fixed; top: 3.4vh; right: 2.4vw; width: 6.6vh; height: 6.6vh; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); display: none; z-index: 5;
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #btn-maison.visible { display: block; }
  #btn-maison svg { display: block; width: 52%; height: 52%; margin: 24% auto 0; }
  #btn-maison .badge { position: absolute; top: -0.6vh; right: -0.6vh; min-width: 2.6vh; height: 2.6vh; line-height: 2.6vh;
    border-radius: 2vh; background: #ffd36b; color: #2a2000; font-size: 1.6vh; font-weight: 600; text-align: center; padding: 0 0.4vh; }
  #btn-maison .badge:empty { display: none; }
  #maison { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; display: none;
    background: #080c22; padding: 5vh 4.5vw; box-sizing: border-box; overflow: hidden; }
  #maison.ouvert { display: block; }
  #maison .entete { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  #maison h1 { font-size: 4.6vh; font-weight: 200; margin: 0; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  #maison .action { -webkit-appearance: none; border: 0; outline: none; color: #fff; font: inherit; font-size: 2.1vh;
    background: rgba(255,255,255,0.12); border-radius: 100px; padding: 1.2vh 1.8vw; margin-left: 1vw; }
  #maison .action:active, #maison .fermer:active { background: rgba(255,255,255,0.3); }
  #maison .fermer { -webkit-appearance: none; border: 0; outline: none; color: #fff; width: 6.6vh; height: 6.6vh;
    border-radius: 50%; background: rgba(255,255,255,0.12); margin-left: 1.6vw; font-size: 3.6vh; line-height: 6.6vh; padding: 0; }
  #maison .rubrique { margin: 3.2vh 0 1.4vh; }
  #maison .grille { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-right: -1.4vw; }
  #maison .eq { width: 21.6vw; margin: 0 1.4vw 1.4vw 0; box-sizing: border-box; position: relative;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-transition: background 0.2s; transition: background 0.2s; }
  #maison .eq .n { font-size: 2.6vh; font-weight: 400; margin-top: 1vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #maison .eq .e { font-size: 1.9vh; font-weight: 300; opacity: 0.65; margin-top: 0.3vh; }
  #maison .lum { padding: 2.2vh 1.6vw; }
  #maison .lum svg { display: block; width: 6vh; height: 6vh; }
  #maison .lum.on { background: rgba(255,211,107,0.22); border-color: rgba(255,211,107,0.55); }
  #maison .lum:active { background: rgba(255,255,255,0.25); }
  #maison .vol { padding: 2vh 1.6vw 1.8vh; }
  #maison .vol .jauge { height: 0.8vh; border-radius: 1vh; background: rgba(255,255,255,0.15); margin-top: 1.2vh; overflow: hidden; }
  #maison .vol .jauge i { display: block; height: 100%; background: #8fc6ff; border-radius: 1vh; }
  #maison .vol .bts { display: -webkit-box; display: -webkit-flex; display: flex; margin-top: 1.4vh;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; }
  #maison .vol button { -webkit-appearance: none; border: 0; outline: none; padding: 0; color: #fff;
    width: 5.6vh; height: 5.6vh; border-radius: 50%; background: rgba(255,255,255,0.13);
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #maison .vol button svg { display: block; width: 46%; height: 46%; margin: 0 auto; fill: currentColor; }
  #maison .vol button:active { background: rgba(255,255,255,0.35); }
  #maison .vide { font-size: 2.4vh; font-weight: 300; opacity: 0.7; margin-top: 4vh; }

  /* Agenda (Google, via le relais) */
  .agenda { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.2vh; display: none; }
  .agenda.visible { display: block; }
  body.musique.agenda-on .heure { font-size: 16.5vh; }
  .agenda .arow { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: baseline; -webkit-align-items: baseline; align-items: baseline;
    padding-top: 0.75vh; font-size: 2.1vh; font-weight: 300; }
  .agenda .aquand { width: 9.5vw; -webkit-flex-shrink: 0; flex-shrink: 0; font-weight: 500; }
  .agenda .aquand.dem { font-weight: 300; opacity: 0.7; }
  .agenda .atitre { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda .alieu { opacity: 0.55; }
  .agenda .encours { color: #ffd36b; }

  /* 3 interrupteurs sur l'écran principal */
  .lumieres { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.6vh; display: none; }
  .lumieres.visible { display: block; }
  body.musique .lumieres { display: none; }
  .lumieres .rang { display: -webkit-box; display: -webkit-flex; display: flex; margin-top: 1vh; }
  .lumieres .bt { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; margin-right: 1.2vw; border-radius: 16px; padding: 1.2vh 1vw;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); -webkit-tap-highlight-color: rgba(0,0,0,0);
    display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-transition: background 0.2s, -webkit-transform 0.12s; transition: background 0.2s, transform 0.12s; min-width: 0; }
  .lumieres .bt:last-child { margin-right: 0; }
  .lumieres .bt:active { -webkit-transform: scale(0.95); transform: scale(0.95); }
  .lumieres .bt svg { width: 3.6vh; height: 3.6vh; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .lumieres .bt .t { margin-left: 0.5vw; min-width: 0; }
  .lumieres .bt .n { font-size: 2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lumieres .bt .e { font-size: 1.7vh; font-weight: 300; opacity: 0.65; }
  .lumieres .bt.on { background: rgba(255,211,107,0.22); border-color: rgba(255,211,107,0.55); }

  /* ---------- Ambiance animée (légère pour iOS 12 : transform + opacity seulement) ---------- */
  #ambiance { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; }
  .goutte { position: absolute; top: -12vh; width: 1.5px; height: 8vh; opacity: 0.5; border-radius: 2px;
    background: -webkit-linear-gradient(top, rgba(200,228,255,0), rgba(200,228,255,1)); background: linear-gradient(to bottom, rgba(200,228,255,0), rgba(200,228,255,1));
    -webkit-animation: chute linear infinite; animation: chute linear infinite; }
  .flocon { position: absolute; top: -3vh; -webkit-animation: chute linear infinite; animation: chute linear infinite; }
  .flocon i { display: block; width: 0.8vh; height: 0.8vh; border-radius: 50%; background: #fff; opacity: 0.75;
    -webkit-animation: balance 3s ease-in-out infinite alternate; animation: balance 3s ease-in-out infinite alternate; }
  @-webkit-keyframes chute { from { -webkit-transform: translate3d(0,0,0); } to { -webkit-transform: translate3d(-3vw,118vh,0); } }
  @keyframes chute { from { transform: translate3d(0,0,0); } to { transform: translate3d(-3vw,118vh,0); } }
  @-webkit-keyframes balance { from { -webkit-transform: translateX(-1.2vw); } to { -webkit-transform: translateX(1.2vw); } }
  @keyframes balance { from { transform: translateX(-1.2vw); } to { transform: translateX(1.2vw); } }
  .nuage { position: absolute; left: 0; width: 46vw; height: 16vh; border-radius: 50%; background: rgba(255,255,255,0.055);
    box-shadow: 9vw -3vh 0 1vh rgba(255,255,255,0.04), -7vw 1vh 0 -1vh rgba(255,255,255,0.04);
    -webkit-animation: derive linear infinite; animation: derive linear infinite; }
  @-webkit-keyframes derive { from { -webkit-transform: translate3d(-60vw,0,0); } to { -webkit-transform: translate3d(120vw,0,0); } }
  @keyframes derive { from { transform: translate3d(-60vw,0,0); } to { transform: translate3d(120vw,0,0); } }
  .filante { position: absolute; width: 14vw; height: 2px; border-radius: 2px; opacity: 0;
    background: -webkit-linear-gradient(left, rgba(255,255,255,0), #fff); background: linear-gradient(to right, rgba(255,255,255,0), #fff);
    -webkit-transform: rotate(-24deg); transform: rotate(-24deg); }
  .filante.go { -webkit-animation: file 1.3s ease-out; animation: file 1.3s ease-out; }
  @-webkit-keyframes file { 0% { opacity: 0; -webkit-transform: rotate(-24deg) translateX(0); } 15% { opacity: 1; }

/* Codes météo WMO -> [texte, icône de jour, icône de nuit, couvert ?] */

  if (c === 51 || c === 53 || c === 55) return ["Bruine", "pluie", "pluie", true];
  if (c === 56 || c === 57) return ["Bruine verglaçante", "pluie", "pluie", true];
  if (c === 61) return ["Pluie faible", "pluie", "pluie", true];

  if (c === 75) return ["Forte neige", "neige", "neige", true];

              [23.99, "Dernier quartier"], [27.68, "Dernier croissant"], [99, "Nouvelle lune"]];
  var nom = "";
  for (var i = 0; i < noms.length; i++) { if (age < noms[i][0]) { nom = noms[i][1]; break; } }

/* ---------- Course du soleil ---------- */
function svgArc(maintenant, lever, coucher) {
  var x0 = 18, x1 = 282, base = 104, h = 86;
  var t = (maintenant - lever) / (coucher - lever);
  var jour = t >= 0 && t <= 1;
  var tt = t < 0 ? 0 : (t > 1 ? 1 : t);
  function pt(f) {
    var a = Math.PI * f;
    return [(x0 + (x1 - x0) * (1 - Math.cos(a)) / 2), (base - h * Math.sin(a))];
  }
  var chemin = "", fait = "";
  for (var i = 0; i <= 40; i++) {
    var q = pt(i / 40);
    chemin += (i === 0 ? "M" : "L") + q[0].toFixed(1) + " " + q[1].toFixed(1) + " ";
    if (i / 40 <= tt) fait += (i === 0 ? "M" : "L") + q[0].toFixed(1) + " " + q[1].toFixed(1) + " ";
  }
  var s = pt(tt);
  if (jour) fait += "L" + s[0].toFixed(1) + " " + s[1].toFixed(1);
  return '<svg viewBox="0 0 300 116" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="4" y1="' + base + '" x2="296" y2="' + base + '" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>' +
    '<path d="' + chemin + '" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>' +
    (jour ? '<path d="' + fait + '" fill="none" stroke="#ffd36b" stroke-width="2.5" stroke-linecap="round"/>' +
            '<circle cx="' + s[0].toFixed(1) + '" cy="' + s[1].toFixed(1) + '" r="13" fill="rgba(255,211,107,0.25)"/>' +
            '<circle cx="' + s[0].toFixed(1) + '" cy="' + s[1].toFixed(1) + '" r="7.5" fill="#ffd36b"/>'
          : '') +
    '</svg>';
}

    if (data) { try { ok(data); } catch (e) {} } else if (ko) { ko(); }

/* ---------- Pluie dans les 2 prochaines heures ---------- */

  var now = new Date().getTime(), t = [], v = [], i;
  for (i = 0; i < mm.time.length && t.length < 8; i++) {

  for (i = 0; i < v.length; i++) if (v[i] > max) max = v[i];
  if (v[0] >= SEUIL) {

    for (i = 1; i < v.length; i++) if (v[i] < SEUIL) { fin = i; break; }

  } else {
    var deb = -1;

                    Math.max(5, Math.round((t[deb].getTime() - now) / 300000) * 5) + " min</span>";
  }
  var b = "";
  for (i = 0; i < v.length; i++) {
    var on = v[i] >= SEUIL;
    b += '<span class="b' + (on ? ' on' : '') + '" style="height:' + (on ? Math.max(25, Math.round(v[i] / max * 100)) : 12) + '%"></span>';
  }
  z.innerHTML = '<span class="barres">' + b + '</span><span class="txt">' + txt + '</span>';
}

/* ---------- Musique en cours (Sonos, via le relais du NAS sur le port 8099) ----------
   La tuile remplace l'éphéméride pendant la lecture, et jusqu'à 15 min après une pause. */
var SVG_LECTURE = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>';
var SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>';
var SVG_NOTE = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V7h7V3z"/></svg>';
var sonosGroupe = null, sonosRecu = 0, sonosDernierJeu = 0, sonosMinuteur = null, sonosPochette = null, sonosOccupe = 0;
function urlSonos() {
  if (CONFIG.sonos === false) return null;
  if (CONFIG.sonos) return CONFIG.sonos;
  if (location.protocol === "file:") return null;
  return location.protocol + "//" + location.hostname + ":8099";
}
function enLecture(g) { return g && (g.etat === "PLAYING" || g.etat === "TRANSITIONING"); }
function choisirGroupe(l) {
  var i, g = null;
  for (i = 0; i < l.length; i++) if (enLecture(l[i])) return l[i];
  if (sonosGroupe) for (i = 0; i < l.length; i++) if (l[i].id === sonosGroupe.id) g = l[i];
  return g;
}
function afficherSonos() {
  var g = sonosGroupe, now = new Date().getTime();

  var visible = g && g.titre && (enLecture(g) || now - sonosDernierJeu < 15 * 60000);
  var avant = document.body.className.indexOf("musique") >= 0;
  document.body.className = document.body.className.replace(/\s*musique/g, "") + (visible ? " musique" : "");
  if (avant !== !!visible && typeof majAgenda === "function") majAgenda();
  demanderAlignement();
  if (!visible) return;
  document.getElementById("sonos-piece").innerHTML = (enLecture(g) ? "En écoute" : "En pause") + " · " + echap(g.nom);
  document.getElementById("sonos-titre").innerHTML = echap(g.titre);
  document.getElementById("sonos-artiste").innerHTML = echap(g.artiste + (g.album && g.artiste ? " — " + g.album : g.album || ""));
  document.getElementById("sonos-lecture").innerHTML = enLecture(g) ? SVG_PAUSE : SVG_LECTURE;
  document.getElementById("sonos-vol").innerHTML = g.volume === null || g.volume === undefined ? "–" : g.volume;
  var p = document.getElementById("sonos-pochette");
  if (g.pochette !== sonosPochette) {
    sonosPochette = g.pochette;
    p.style.backgroundImage = g.pochette ? "url('" + g.pochette.replace(/'/g, "%27") + "')" : "none";
    p.innerHTML = g.pochette ? "" : SVG_NOTE;
  }

}
function majBarreSonos() {
  var g = sonosGroupe;

  var pos = g.pos + (enLecture(g) ? (new Date().getTime() - sonosRecu) / 1000 : 0);
  document.getElementById("sonos-barre").style.width = Math.min(100, pos / g.duree * 100).toFixed(1) + "%";
}
function chargerSonos() {
  clearTimeout(sonosMinuteur);
  var u = urlSonos();
  if (location.hash === "#demo") { sonosGroupe = sonosGroupe || sonosDemo(); sonosRecu = sonosRecu || new Date().getTime(); afficherSonos(); return; }
  if (!u) return;
  chargerJSON(u + "/sonos?t=" + new Date().getTime(), function (d) {
    var l = d.groupes || [], joue = false;
    for (var i = 0; i < l.length; i++) if (enLecture(l[i])) joue = true;
    sonosMinuteur = setTimeout(chargerSonos, joue ? 5000 : 20000);
    if (new Date().getTime() - sonosOccupe > 1500) {
      sonosGroupe = choisirGroupe(l); sonosRecu = new Date().getTime(); afficherSonos();
    }
  }, function () {
    sonosMinuteur = setTimeout(chargerSonos, 60000);
  });
}
function cmdSonos(a) {
  var g = sonosGroupe;
  if (!g) return;
  if (a === "basculer") a = enLecture(g) ? "pause" : "play";
  // affichage immédiat, confirmé ensuite par l'enceinte
  if (a === "pause") { g.pos += (new Date().getTime() - sonosRecu) / 1000; g.etat = "PAUSED_PLAYBACK"; }
  if (a === "play") g.etat = "PLAYING";
  if (a === "volup" && g.volume !== null) g.volume = Math.min(100, g.volume + 3);
  if (a === "voldown" && g.volume !== null) g.volume = Math.max(0, g.volume - 3);
  sonosRecu = new Date().getTime(); sonosOccupe = sonosRecu;
  afficherSonos();

  var el = document.getElementById("sonos");
  el.className = "carte sonos attente";
  chargerJSON(urlSonos() + "/sonos/cmd?id=" + encodeURIComponent(g.id) + "&a=" + a + "&t=" + sonosRecu, function (e) {
    el.className = "carte sonos";
    if (e && e.id) { sonosGroupe = e; sonosRecu = new Date().getTime(); afficherSonos(); }
    clearTimeout(sonosMinuteur); sonosMinuteur = setTimeout(chargerSonos, 1500);
  }, function () { el.className = "carte sonos"; chargerSonos(); });

/* ---------- Ambiance animée selon la météo réelle ----------
   pluie ou neige qui tombe, nuages qui passent, givre les jours de gel, étoile filante les nuits claires.
   Une seule ambiance à la fois, peu d'éléments, pour rester fluide sur un vieil iPad. */
var ambianceCle = "", filanteMinuteur = null;
function hasard(a, b) { return a + Math.random() * (b - a); }
function majAmbiance(code, temp, nuit) {
  if (!CONFIG.animerIcones) return;
  var pluie = (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95;
  var neige = (code >= 71 && code <= 77) || code === 85 || code === 86;
  var nuages = code === 2 || code === 3 || code === 45 || code === 48;
  var gel = temp !== undefined && temp <= 0.5;
  var cle = (neige ? "neige" : pluie ? "pluie" : nuages ? "nuages" : nuit ? "nuitclaire" : "rien") + (gel ? "+gel" : "");
  if (cle === ambianceCle) return;
  ambianceCle = cle;
  clearTimeout(filanteMinuteur);
  var h = "", i;
  if (pluie) for (i = 0; i < 40; i++)
    h += '<div class="goutte" style="left:' + hasard(0, 104).toFixed(1) + '%;-webkit-animation-duration:' + hasard(1.8, 2.6).toFixed(2) +
      's;animation-duration:' + hasard(1.8, 2.6).toFixed(2) + 's;-webkit-animation-delay:-' + hasard(0, 2.6).toFixed(2) + 's;animation-delay:-' + hasard(0, 2.6).toFixed(2) + 's"></div>';
  if (neige) for (i = 0; i < 28; i++) {
    var t = hasard(9, 16).toFixed(1), r = hasard(0, 16).toFixed(1);
    h += '<div class="flocon" style="left:' + hasard(0, 104).toFixed(1) + '%;-webkit-animation-duration:' + t + 's;animation-duration:' + t +
      's;-webkit-animation-delay:-' + r + 's;animation-delay:-' + r + 's"><i style="-webkit-animation-delay:-' + hasard(0, 3).toFixed(1) + 's;animation-delay:-' +
      hasard(0, 3).toFixed(1) + 's;-webkit-transform:scale(' + hasard(0.6, 1.3).toFixed(2) + ')"></i></div>';
  }
  if (nuages || pluie || neige) for (i = 0; i < 3; i++) {
    var dur = hasard(140, 220).toFixed(0);
    h += '<div class="nuage" style="top:' + (6 + i * 22) + 'vh;-webkit-animation-duration:' + dur + 's;animation-duration:' + dur +
      's;-webkit-animation-delay:-' + (i * dur / 3).toFixed(0) + 's;animation-delay:-' + (i * dur / 3).toFixed(0) + 's"></div>';
  }
  if (gel) {
    var cristal = "";   // voile givré discret, sans motif
    h += '<div class="givre" style="left:-12vh;top:-12vh">' + cristal + '</div><div class="givre" style="right:-12vh;top:-12vh">' + cristal + '</div>' +
         '<div class="givre" style="left:-12vh;bottom:-12vh">' + cristal + '</div><div class="givre" style="right:-12vh;bottom:-12vh">' + cristal + '</div>';
  }
  if (!pluie && !neige && !nuages && nuit) { h += '<div class="filante" id="filante"></div>'; filanteMinuteur = setTimeout(etoileFilante, hasard(20000, 60000)); }
  el("ambiance").innerHTML = h;
}
function etoileFilante() {
  var f = el("filante");
  if (!f) return;
  f.className = "filante";
  f.style.left = hasard(5, 60).toFixed(0) + "%"; f.style.top = hasard(4, 35).toFixed(0) + "%";
  setTimeout(function () { f.className = "filante go"; }, 50);
  filanteMinuteur = setTimeout(etoileFilante, hasard(60000, 150000));
}

/* ---------- Agenda Google (agenda.json, écrit par le relais du NAS) ----------
   Rendez-vous d'aujourd'hui (pas encore terminés) puis de demain ; carte masquée s'il n'y a rien. */
var etatAgenda = [];
function chargerAgenda() {
  setTimeout(chargerAgenda, 15 * 60000);
  if (location.hash === "#demo") { etatAgenda = agendaDemo(); majAgenda(); return; }
  if (!CONFIG.urlAgenda) return;
  chargerJSON(CONFIG.urlAgenda + "?t=" + new Date().getTime(), function (d) { etatAgenda = d || []; majAgenda(); });
}
function majAgenda() {
  var now = new Date(), l = [], i, carte = el("agenda-carte");
  for (i = 0; i < etatAgenda.length; i++) {
    var e = etatAgenda[i], d = parseISO(e.debut), f = parseISO(e.fin), nj = joursEntre(now, d);
    if (f <= now) continue;
    if (nj > 1) continue;
    if (nj < 0) nj = 0;                     // commencé avant aujourd'hui, toujours en cours
    l.push({ e: e, d: d, f: f, nj: nj, encours: d <= now });
  }
  document.body.className = document.body.className.replace(/\s*agenda-on/g, "") + (l.length ? " agenda-on" : "");
  demanderAlignement();
  if (!l.length) { carte.className = "carte agenda"; return; }
  var n = document.body.className.indexOf("musique") >= 0 ? 1 : CONFIG.agendaLignes, h = "", aujN = 0;
  for (i = 0; i < l.length; i++) if (l[i].nj === 0) aujN++;
  for (i = 0; i < l.length && i < n; i++) {
    var x = l[i], quand;
    if (x.e.journee) quand = x.nj === 0 ? "Aujourd'hui" : "Demain";
    else if (x.encours) quand = "En cours";
    else quand = (x.nj === 1 ? "Dem. " : "") + hm(x.d);
    h += '<div class="arow"><span class="aquand' + (x.nj === 1 ? " dem" : "") + (x.encours && !x.e.journee ? " encours" : "") + '">' + quand + "</span>" +
      '<span class="atitre">' + echap(x.e.titre) + (x.e.lieu ? ' <span class="alieu">· ' + echap(x.e.lieu) + "</span>" : "") + "</span></div>";
  }
  var reste = l.length - Math.min(n, l.length);
  el("agenda-titre").innerHTML = (aujN ? "Agenda · aujourd'hui" : "Agenda · demain") + (reste > 0 ? " · +" + reste : "");
  el("agenda").innerHTML = h;
  carte.className = "carte agenda visible";
}
setInterval(majAgenda, 60000);
function agendaDemo() {
  var d = new Date(), j = d.getFullYear() + "-" + deux(d.getMonth() + 1) + "-" + deux(d.getDate()),
      t = new Date(d.getTime() + 86400000), k = t.getFullYear() + "-" + deux(t.getMonth() + 1) + "-" + deux(t.getDate());
  return [{ titre: "Piscine Matt", lieu: "Piscine de Domont", debut: j + "T18:30", fin: j + "T19:30", journee: false },

/* ---------- Pages en glissant : Agenda · Météo · ACCUEIL · Maison · PSG ----------
   Glisser du doigt (ou de la souris, ou flèches du clavier). Retour à l'accueil après 2 min sans toucher. */
var PAGE_ACCUEIL = 2, pageActuelle = 2, dernierContact = new Date().getTime(), glisse = null;
var RENDUS_PAGES = [rendreAgenda, rendreMeteo, null, rendreMaisonPage, rendreFoot, rendreCantine], NB_PAGES = 6;
function allerA(n, sansAnim) {
  n = Math.max(0, Math.min(NB_PAGES - 1, n));
  var p = el("pages");
  p.className = sansAnim ? "" : "anim";
  pageActuelle = n;
  var x = "translate3d(" + (-n * 100 / NB_PAGES).toFixed(4) + "%,0,0)";
  p.style.webkitTransform = x; p.style.transform = x;
  var pts = el("points").children;
  for (var i = 0; i < pts.length; i++) pts[i].className = i === n ? "actif" : "";
  el("btn-maison").style.display = n === PAGE_ACCUEIL ? "" : "none";
  dernierContact = new Date().getTime();
  rendrePage();
  if (n === 3) chargerMaison();
}
function rendrePage() {
  var f = RENDUS_PAGES[pageActuelle];
  if (!f) return;
  var anim = CONFIG.animerIcones;
  CONFIG.animerIcones = false;          // icônes fixes sur les pages annexes : plus léger pour l'iPad
  try { f(); } catch (e) {}
  CONFIG.animerIcones = anim;
}
setInterval(function () {
  // retour seul à l'accueil après quelques minutes sans toucher l'écran (3 par défaut)
  if (pageActuelle !== PAGE_ACCUEIL && new Date().getTime() - dernierContact > (CONFIG.retourAccueilMinutes || 3) * 60000) allerA(PAGE_ACCUEIL);
  else if (pageActuelle !== PAGE_ACCUEIL) rendrePage();
}, 15000);
function debutGlisse(x, y) { glisse = { x: x, y: y, dx: 0, actif: false }; dernierContact = new Date().getTime(); }
function suiteGlisse(x, y, ev) {
  if (!glisse) return;
  var dx = x - glisse.x, dy = y - glisse.y;
  if (!glisse.actif && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) { glisse.actif = true; clearTimeout(appuiLong); }
  if (!glisse.actif) return;
  if (ev && ev.preventDefault) ev.preventDefault();
  glisse.dx = dx;
  var largeur = window.innerWidth, base = -pageActuelle * largeur;
  if ((pageActuelle === 0 && dx > 0) || (pageActuelle === NB_PAGES - 1 && dx < 0)) dx = dx / 3;   // résistance aux bords
  var p = el("pages"), t = "translate3d(" + (base + dx) + "px,0,0)";
  p.className = ""; p.style.webkitTransform = t; p.style.transform = t;
}
function finGlisse() {
  if (!glisse) return;
  var g = glisse; glisse = null;
  if (!g.actif) return;
  var seuil = window.innerWidth * 0.12;
  allerA(g.dx < -seuil ? pageActuelle + 1 : g.dx > seuil ? pageActuelle - 1 : pageActuelle);
}
document.addEventListener("touchstart", function (e) { var t = e.touches[0]; debutGlisse(t.clientX, t.clientY); }, false);
document.addEventListener("touchmove", function (e) { var t = e.touches[0]; suiteGlisse(t.clientX, t.clientY, e); }, { passive: false });
document.addEventListener("touchend", function () { finGlisse(); }, false);
document.addEventListener("mousedown", function (e) { debutGlisse(e.clientX, e.clientY); }, false);
document.addEventListener("mousemove", function (e) { if (glisse) suiteGlisse(e.clientX, e.clientY, e); }, false);
document.addEventListener("mouseup", function () { finGlisse(); }, false);
document.addEventListener("click", function (e) {   // un glissement ne doit pas déclencher de bouton
  if (glisseVientDeFinir) { e.stopPropagation(); e.preventDefault(); }
}, true);
var glisseVientDeFinir = false;
(function () {
  var fin = finGlisse;
  finGlisse = function () { var a = glisse && glisse.actif; fin(); if (a) { glisseVientDeFinir = true; setTimeout(function () { glisseVientDeFinir = false; }, 350); } };
})();
document.addEventListener("keydown", function (e) {
  if (e.keyCode === 37) allerA(pageActuelle - 1);
  if (e.keyCode === 39) allerA(pageActuelle + 1);
});
window.addEventListener("resize", function () { allerA(pageActuelle, true); });

/* --- page Météo --- */
function rendreMeteo() {
  var m = etatMeteo, z = el("page-meteo");
  if (!m || !m.hourly) { z.innerHTML = "<h2>Météo</h2>"; return; }
  var h = m.hourly, now = new Date(), cle = now.getFullYear() + "-" + deux(now.getMonth() + 1) + "-" + deux(now.getDate()) + "T" + deux(now.getHours()) + ":00";
  var i0 = 0;
  for (var i = 0; i < h.time.length; i++) if (h.time[i] >= cle) { i0 = i; break; }
  var N = 25, T = [], P = [], R = [], k;
  for (k = 0; k < N && i0 + k < h.time.length; k++) { T.push(h.temperature_2m[i0 + k]); P.push(h.precipitation_probability ? h.precipitation_probability[i0 + k] : 0); R.push(h.precipitation[i0 + k] || 0); }

  var W = 1000, H = 240, gx = function (j) { return 20 + j * (W - 40) / (N - 1); }, gy = function (t) { return 30 + (tmax - t) / (tmax - tmin) * 120; };

  for (k = 0; k < N; k++) ligne += (k ? " L" : "M") + gx(k).toFixed(1) + " " + gy(T[k]).toFixed(1);
  aire = ligne + " L" + gx(N - 1) + " 165 L" + gx(0) + " 165 Z";
  var barres = "";
  for (k = 0; k < N; k++) {
    var hb = Math.min(60, R[k] * 30 + (P[k] >= 30 ? 4 : 0));
    if (hb > 0) barres += '<rect x="' + (gx(k) - 9).toFixed(1) + '" y="' + (235 - hb) + '" width="18" height="' + hb + '" rx="3" fill="#7fb8ff" opacity="' + (0.35 + Math.min(0.6, P[k] / 150)) + '"/>';
  }
  var reperes = "";
  for (k = 0; k < N; k += 3) reperes += '<circle cx="' + gx(k).toFixed(1) + '" cy="' + gy(T[k]).toFixed(1) + '" r="5" fill="#fff"/>';
  var svg = '<svg class="m-graph" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36b" stop-opacity="0.35"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></linearGradient></defs>' +
    '<line x1="0" y1="235" x2="' + W + '" y2="235" stroke="rgba(255,255,255,0.15)"/>' + barres +
    '<path d="' + aire + '" fill="url(#gT)"/><path d="' + ligne + '" fill="none" stroke="#ffd36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>' + reperes + "</svg>";
  var haut = "", bas = "";
  for (k = 0; k < N; k += 3) {
    var hh = h.time[i0 + k].substr(11, 2), jour = h.is_day ? h.is_day[i0 + k] : 1, inf = meteoInfo(h.weather_code[i0 + k]);
    var pos = ' style="left:' + (gx(k) / W * 100).toFixed(2) + '%"';
    haut += "<div" + pos + '><div class="t">' + Math.round(T[k]) + "°</div>" + svgIcone(jour ? inf[1] : inf[2]) + "</div>";
    bas += "<div" + pos + '><div class="h">' + (k === 0 ? "Maint." : hh + "h") + '</div><div class="v">' + (P[k] >= 20 ? '<span style="color:#a9d4ff">' + P[k] + " %</span> · " : "") + Math.round(h.wind_speed_10m[i0 + k]) + " km/h</div></div>";
  }
  var d = m.daily, o = 1, jours = "";
  for (k = o; k < d.time.length && k < o + 7; k++) {
    var dj = jourISO(d.time[k]), inf2 = meteoInfo(d.weather_code[k]), pp = d.precipitation_probability_max ? d.precipitation_probability_max[k] : null;
    jours += '<div class="carte"><div class="n">' + (k === o ? "Aujourd'hui" : k === o + 1 ? "Demain" : JOURS[dj.getDay()].charAt(0).toUpperCase() + JOURS[dj.getDay()].substr(1, 2) + ". " + dj.getDate()) + "</div>" +
      svgIcone(inf2[1]) + '<div><span class="mx">' + Math.round(d.temperature_2m_max[k]) + '°</span><span class="mn">' + Math.round(d.temperature_2m_min[k]) + "°</span></div>" +

    '</div><div class="carte"><div class="etiquette">Prochains matchs</div>' + (b || '<div class="f-vide">Pas encore programmé</div>') + "</div></div></div>";
}

/* --- page Cantine (cantine.json, écrit par le relais à partir des PDF du dossier Web/cantine) --- */
var etatCantine = null;
function chargerCantine() {
  setTimeout(chargerCantine, 3 * 3600000);
  if (location.hash === "#demo") { etatCantine = cantineDemo(); return; }
  chargerJSON("cantine.json?t=" + new Date().getTime(), function (d) { etatCantine = d; });
}
function platCantine(r, t, cl, sp) {
  return t ? '<div class="c-plat' + (cl ? " " + cl : "") + '"><div class="r">' + r + '</div><div class="t">' + echap(t) + "</div>" +
    (sp ? '<div class="sp">Sans porc : ' + echap(sp) + "</div>" : "") + "</div>" : "";
}
function cleJour(d) { return d.getFullYear() + "-" + deux(d.getMonth() + 1) + "-" + deux(d.getDate()); }
function rendreCantine() {
  var z = el("page-cantine"), now = new Date(), j = now.getDay();
  // semaine affichée : celle en cours ; le week-end (et le vendredi après 14 h), la suivante
  var lundi = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((j + 6) % 7));
  if (j === 6 || j === 0 || (j === 5 && now.getHours() >= 14)) lundi = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 7);
  var h = "", nb = 0;
  for (var k = 0; k < 5; k++) {
    var d = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + k), m = etatCantine && etatCantine[cleJour(d)];
    if (!m) continue;
    nb++;
    var auj = cleJour(d) === cleJour(now);
    h += '<div class="carte c-jour' + (auj ? " auj" : "") + '"><div class="etiquette">' + (auj ? "Aujourd'hui" : JOURS[d.getDay()] + " " + d.getDate()) + "</div>" +
      platCantine("Entrée", m.entree, "", m.entree_sansporc) + platCantine("Plat", m.plat, "principal", m.plat_sansporc) +
      platCantine("Accompagnement", m.garniture) + platCantine("Laitage", m.laitier) + platCantine("Dessert", m.dessert) + "</div>";
  }
  var ven = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 4);
  z.innerHTML = "<h2>Cantine<span>semaine du " + lundi.getDate() + " " + MOISCOURT[lundi.getMonth()] + " au " + ven.getDate() + " " + MOISCOURT[ven.getMonth()] + "</span></h2>" +
    (nb ? '<div class="c-grille">' + h + "</div>" : '<div class="c-vide">' + (etatCantine ? "Pas de menu pour cette semaine (vacances ?)." : "Aucun menu : déposez le PDF du mois dans le dossier Web/cantine du NAS.") + "</div>");
}
function cantineDemo() {
  var now = new Date(), j = now.getDay(), l = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((j + 6) % 7)), r = {};
  var ex = [["Rosette et beurre", "Paupiette au veau et petits oignons", "Boulgour", "Edam", "Novly vanille"],
            ["Salade Flersoise", "Gratin de poisson MSC dieppoise", "Brunoise de légumes à la crème", "Petits suisses sucrés", "Tarte au chocolat"], null,
            ["Carottes râpées vinaigrette", "Hachis parmentier VBF", "Salade verte", "Camembert", "Fruit frais"],
            ["Crêpe au fromage", "Beignets au calamar et quartier de citron", "Gratin de choux romanesco et brocolis", "Fromage blanc et dosette de sucre", "Gaufre au sucre"]];
  for (var k = 0; k < 5; k++) if (ex[k]) r[cleJour(new Date(l.getFullYear(), l.getMonth(), l.getDate() + k))] = { entree: ex[k][0], plat: ex[k][1], garniture: ex[k][2], laitier: ex[k][3], dessert: ex[k][4] };
  r[cleJour(l)].entree_sansporc = "Salade de boulgour tomate poivron maïs";
  return r;
}

/* ---------- Mode match plein écran (PSG, toutes compétitions) ---------- */
var matchReduit = false, matchOuvert = false, dernierScore = null;
function sigleEquipe(e) {
  if (e && e.logo) return '<img src="' + echap(e.logo) + '" alt="">';
  return '<div class="sigle">' + echap(nomEquipe(e && e.nom).substr(0, 3).toUpperCase()) + "</div>";
}
function majMatch(avant) {
  var d = footDirect;
  if (!d || !d.dom) return;
  var actif = d.etat === "in" || d.etat === "post";
  if (!actif) return;
  // nouveau but ?
  var cle = d.sd + "-" + d.se;
  if (dernierScore !== null && cle !== dernierScore) {
    var nousDom = d.dom.nom === CONFIG.equipe.nom, ancien = dernierScore.split("-");
    var butDom = d.sd > +ancien[0], butExt = d.se > +ancien[1];
    var pourNous = (butDom && nousDom) || (butExt && !nousDom);
    var dernierBut = null;
    for (var i = d.buts.length - 1; i >= 0; i--) if (d.buts[i].nous === pourNous) { dernierBut = d.buts[i]; break; }
    if (butDom || butExt) celebrerBut(pourNous, dernierBut, pourNous ? null : nomEquipe(nousDom ? d.ext.nom : d.dom.nom));
    matchReduit = false;   // un but ré-ouvre le mode match
  }
  dernierScore = cle;
  if (!matchReduit) ouvrirMatch();
  rendreMatch(avant && (avant.sd !== d.sd || avant.se !== d.se));
}
function logoNous() {
  var d = footDirect;
  if (!d || !d.dom) return "";
  return d.dom.nom === CONFIG.equipe.nom ? d.dom.logo : d.ext.nom === CONFIG.equipe.nom ? d.ext.logo : "";
}
function rendreMatch(rebond) {
  var d = footDirect, z = el("match-contenu");
  if (!d || !d.dom) return;
  var lg = logoNous();
  el("filigrane").style.backgroundImage = lg ? "url('" + lg.replace(/'/g, "%27") + "')" : "none";
  var pause = d.nomEtat === "STATUS_HALFTIME" || /^(HT|Halftime|Mi-temps)$/i.test(d.detail), fin = d.etat === "post";
  var chrono = fin ? "Terminé" : pause ? "Mi-temps" : (d.minute || d.detail);
  var nousDom = d.dom.nom === CONFIG.equipe.nom, g = "", dr = "";
  for (var i = 0; i < d.buts.length; i++) {
    var b = d.buts[i], ligne = "<p>&#9917; <b>" + echap(b.nom) + "</b> " + echap(b.min) + "</p>";
    if (b.nous === nousDom) g += ligne; else dr += ligne;
  }
  function stat(lib, cle, pct) {
    var a = d.stats.home && d.stats.home[cle], b2 = d.stats.away && d.stats.away[cle];
    if (a === undefined || b2 === undefined) return "";
    var na = parseFloat(a) || 0, nb = parseFloat(b2) || 0, tot = na + nb || 1;
    return '<div class="stat"><span class="v">' + a + (pct ? "%" : "") + '</span><span class="barre"><i style="width:' + (na / tot * 100).toFixed(0) + '%"></i></span>' +
      '<span class="lib">' + lib + '</span><span class="barre" style="-webkit-transform:scaleX(-1);transform:scaleX(-1)"><i style="width:' + (nb / tot * 100).toFixed(0) + '%"></i></span><span class="v">' + b2 + (pct ? "%" : "") + "</span></div>";
  }
  z.innerHTML = '<div class="compet">' + echap(ESPN_COMPET[d.compet] || "") + "</div>" +
    '<div class="chrono' + (pause ? " pause" : "") + (fin ? " fin" : "") + '"><i></i>' + echap(chrono) + "</div>" +
    '<div class="duel"><div class="equipe' + (nousDom ? " nous" : "") + '">' + sigleEquipe(d.dom) + '<div class="nom">' + echap(nomEquipe(d.dom.nom)) + "</div></div>" +
    '<div class="score"><span' + (rebond ? ' class="rebond"' : "") + ">" + d.sd + '</span><span class="tiret">–</span><span' + (rebond ? ' class="rebond"' : "") + ">" + d.se + "</span></div>" +
    '<div class="equipe' + (nousDom ? "" : " nous") + '">' + sigleEquipe(d.ext) + '<div class="nom">' + echap(nomEquipe(d.ext.nom)) + "</div></div></div>" +
    '<div class="buts"><div class="g">' + g + '</div><div class="d">' + dr + "</div></div>" +
    '<div class="stats">' + stat("Possession", "possessionPct", true) + stat("Tirs", "totalShots") + stat("Cadrés", "shotsOnTarget") + "</div>";
}
function ouvrirMatch() { if (!matchOuvert) { matchOuvert = true; el("match").className = "ouvert"; } }
function fermerMatch() { matchOuvert = false; el("match").className = ""; dernierScore = null; matchReduit = false; }
function reduireMatch() { matchReduit = true; matchOuvert = false; el("match").className = ""; }
function celebrerBut(pourNous, but, adversaire) {
  if (!CONFIG.animerIcones) return;
  var z = el("but");
  z.className = "";
  var lg = logoNous();
  z.innerHTML = '<div class="flash"></div>' + (pourNous ? '<div class="onde"></div><div class="onde" style="-webkit-animation-delay:.5s;animation-delay:.5s"></div>' : "") +
    (pourNous && lg ? '<img class="ecusson" src="' + echap(lg) + '" alt="">' : "") +
    '<div class="mot">' + (pourNous ? "BUT !" : "But " + (adversaire ? "de " + echap(adversaire) : "adverse")) + "</div>" +
    (but ? '<div class="qui">' + echap(but.nom) + " · " + echap(but.min) + "</div>" : "");
  setTimeout(function () { z.className = "go" + (pourNous ? "" : " eux"); }, 30);
  setTimeout(function () { z.className = ""; z.innerHTML = ""; }, 12300);
}
// aperçu : match simulé (#demo + matchDemo() dans la console)
function matchDemo() {
  footDirect = { etat: "in", minute: "67'", detail: "67'", nomEtat: "STATUS_SECOND_HALF", sd: 1, se: 1, compet: "uefa.champions",
    dom: { nom: "Paris Saint-Germain", logo: "https://a.espncdn.com/i/teamlogos/soccer/500/160.png" },
    ext: { nom: "AS Roma", logo: "https://a.espncdn.com/i/teamlogos/soccer/500/104.png" },
    buts: [{ nom: "Dembélé", min: "23'", nous: true }, { nom: "Dybala", min: "51'", nous: false }],
    stats: { home: { possessionPct: "61", totalShots: "14", shotsOnTarget: "6" }, away: { possessionPct: "39", totalShots: "7", shotsOnTarget: "3" } } };
  dernierScore = "1-1"; majMatch(null);
}
function matchDemoBut() {
  var avant = { sd: footDirect.sd, se: footDirect.se };
  footDirect.sd = 2; footDirect.minute = "74'"; footDirect.buts.push({ nom: "Doué", min: "74'", nous: true });
  majMatch(avant);
}

/* ---------- Rechargement automatique ----------
   Le relais du NAS remplace index.html quand une nouvelle version est publiée :
   la page vérifie toutes les 30 min si elle a changé et se recharge. Rechargement aussi chaque nuit à 3h. */
var signaturePage = null;
function signature(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ":" + h; }
// Recharge avec une adresse nouvelle : l'icône d'écran d'accueil d'iOS garde sinon l'ancienne page en cache.
function recharger() { location.replace(location.pathname + "?v=" + new Date().getTime() + location.hash); }
function verifierVersion() {
  if (location.protocol === "file:" || location.hash === "#demo") return;
  var x = new XMLHttpRequest();
  x.open("GET", "index.html?v=" + new Date().getTime(), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200 || x.responseText.length < 5000) return;
    var s = signature(x.responseText);
    if (signaturePage === null) signaturePage = s;
    else if (s !== signaturePage) recharger();
  };
  try { x.send(); } catch (e) {}
}
setInterval(function () {
  var d = new Date();
  if (d.getHours() === 3 && d.getMinutes() === 0 && d.getSeconds() < 2) recharger();
}, 1000);
setInterval(verifierVersion, 30 * 60000);
verifierVersion();

/* ---------- Démarrage ---------- */
creerEtoiles();
majHorloge();
setInterval(majHorloge, 1000);
setInterval(tourner, CONFIG.secondesParInfo * 1000);
chargerMeteo();
chargerAir();
chargerFoot();
chargerInterieur();
chargerSonos();
chargerMaison();
chargerActus();
chargerAgenda();
chargerCantine();
alignerColonnes();
allerA(PAGE_ACCUEIL, true);
// démonstration du mode match : ouvrir la page avec #match (but simulé au bout de 6 s)
if (location.hash === "#match") setTimeout(function () { matchDemo(); setTimeout(matchDemoBut, 6000); }, 1500);
</script>

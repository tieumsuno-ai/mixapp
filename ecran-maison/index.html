<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b1026">
<title>Écran maison</title>
<!--
  ÉCRAN MAISON — page d'affichage pour vieille tablette (Android 5+)
  JavaScript "ancien" (ES5) et CSS simple, pour les vieux moteurs web.
  Météo : Open-Meteo (gratuit, sans clé).
  RÉGLAGES : modifiez uniquement le bloc CONFIG dans le script.
  Aperçu avec des données fictives : ajoutez #demo à la fin de l'adresse.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0b1026;
    color: #fff;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #ciel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  #etoiles { position: fixed; top: 0; left: 0; right: 0; height: 70%; opacity: 0; -webkit-transition: opacity 3s; transition: opacity 3s; }
  body.ciel-nuit #etoiles { opacity: 1; }
  .etoile { position: absolute; width: 2px; height: 2px; border-radius: 1px; background: #fff; }
  #voile { position: fixed; left: 0; right: 0; bottom: 0; height: 45%;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0), rgba(0,0,0,0.35));
    background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.35)); }

  .page {
    position: relative;
    display: -webkit-box; display: -webkit-flex; display: flex;
    height: 100%; box-sizing: border-box;
    padding: 5vh 4.5vw 4vh;
    -webkit-transition: opacity 2s; transition: opacity 2s;
  }
  body.attenue .page { opacity: 0.55; }
  .col {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    min-width: 0;
  }
  .gauche { -webkit-box-flex: 11; -webkit-flex: 11; flex: 11; padding-right: 3.5vw; }
  .droite { -webkit-box-flex: 10; -webkit-flex: 10; flex: 10; }
  .pousse { display: none; }
  /* alignement : la dernière tuile visible de chaque colonne s'étire jusqu'en bas */
  .col > .carte.etire { -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; }

  .etiquette {
    font-size: 1.9vh; font-weight: 500; letter-spacing: 0.22em;
    text-transform: uppercase; opacity: 0.6;
  }

  /* Horloge */
  .heure { font-size: 21vh; font-weight: 600; line-height: 0.9; letter-spacing: -0.03em; margin-left: -0.6vw; }
  .heure .deuxpoints { opacity: 0.55; margin: 0 0.3vw; }
  .date { font-size: 4.8vh; font-weight: 300; margin-top: 1.6vh; }
  .date:first-letter { text-transform: uppercase; }
  .sousdate { font-size: 2.3vh; font-weight: 300; opacity: 0.6; margin-top: 1vh; letter-spacing: 0.02em; }

  /* Cartes "verre" */
  .carte {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 1.8vh 2vw;
  }
  .fete { margin-top: 2.2vh; }
  .fete .nom { font-size: 4vh; font-weight: 300; margin-top: 0.6vh; }

  .ephem { margin-top: 1.6vh; }
  .ephem .rangee {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  }
  .soleil { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .soleil svg { display: block; width: 100%; height: 10vh; }
  .heures-soleil {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    font-size: 2.4vh; font-weight: 300; margin-top: 0.6vh;
  }
  .heures-soleil b { font-weight: 400; }
  .heures-soleil .milieu { opacity: 0.65; }
  .separe { width: 1px; align-self: stretch; -webkit-align-self: stretch; background: rgba(255,255,255,0.14); margin: 0 2vw; }
  .ephem { display: none !important; }   /* remplacée par la ligne soleil/lune sous la météo */
  .astre { font-size: 2.05vh; font-weight: 300; opacity: 0.8; margin-top: 1vh; white-space: nowrap; }
  .astre b { font-weight: 400; }
  .astre .sep { opacity: 0.45; margin: 0 0.6vw; }
  .astre svg { display: inline-block; width: 2.1vh; height: 2.1vh; vertical-align: -0.45vh; margin-right: 0.4vw; }
  .lune { position: absolute; top: 1.5vh; right: 1.8vw; font-size: 1.8vh; font-weight: 300; opacity: 0.75; white-space: nowrap; }
  .lune svg { display: inline-block; width: 2.2vh; height: 2.2vh; vertical-align: -0.5vh; margin-right: 0.5vw; }
  .lune .pct { display: none; }

  /* Collecte des déchets */
  .collecte { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.2vh; }
  .collecte .crow { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    padding: 0.45vh 0; }
  .collecte .crow:first-of-type { padding-top: 0.7vh; }
  .collecte .cquand { font-size: 2vh; font-weight: 300; }
  .collecte .crow.first .cquand { font-weight: 500; }
  .collecte .cjour { width: 40%; font-size: 2vh; font-weight: 300; }
  .collecte .crow.first .cjour { font-weight: 500; }
  .collecte .soir { font-size: 1.7vh; font-weight: 400; color: #ffd36b; margin-left: 0.6vw; }
  .collecte .cbacs { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .collecte .bac { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    font-size: 1.9vh; font-weight: 300; margin-right: 1.4vw; }
  .collecte .bac svg { width: 2.7vh; height: 2.7vh; margin-right: 0.4vw; }

  /* Musique en cours (Sonos) */
  .sonos { margin-top: 1.6vh; display: none; padding: 1.6vh 1.6vw; }
  body.musique .sonos { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .sonos .pochette { width: 16vh; height: 16vh; border-radius: 12px; -webkit-flex-shrink: 0; flex-shrink: 0;
    background: rgba(255,255,255,0.12) center/cover no-repeat; margin-right: 1.8vw;
    box-shadow: 0 0.6vh 2vh rgba(0,0,0,0.35); position: relative; }
  .sonos .pochette svg { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; opacity: 0.5; }
  .sonos .texte { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; }
  .sonos .titre { font-size: 3vh; font-weight: 400; margin-top: 0.5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sonos .artiste { font-size: 2.2vh; font-weight: 300; opacity: 0.7; margin-top: 0.2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sonos .barre { height: 0.45vh; border-radius: 1vh; background: rgba(255,255,255,0.16); margin-top: 1vh; overflow: hidden; }
  .sonos .barre i { display: block; height: 100%; width: 0; background: rgba(255,255,255,0.75); border-radius: 1vh; }
  .sonos .commandes { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-top: 1.2vh; }
  .sonos button { -webkit-appearance: none; appearance: none; border: 0; padding: 0; margin: 0 0.9vw 0 0; outline: none;
    width: 5.6vh; height: 5.6vh; border-radius: 50%; background: rgba(255,255,255,0.13); color: #fff;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-transition: -webkit-transform 0.12s, background 0.12s; transition: transform 0.12s, background 0.12s; }
  .sonos button svg { display: block; width: 44%; height: 44%; margin: 0 auto; fill: currentColor; }
  .sonos button.lecture { width: 7vh; height: 7vh; background: #fff; color: #0b1026; }
  .sonos button:active { -webkit-transform: scale(0.88); transform: scale(0.88); background: rgba(255,255,255,0.3); }
  .sonos button.lecture:active { background: #d8dcf0; }
  .sonos .vol { margin-left: auto; display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .sonos .vol button { margin: 0; width: 6.4vh; height: 6.4vh; }
  .sonos .vol button svg { width: 50%; height: 50%; }
  .sonos .vol span { font-size: 2.6vh; font-weight: 400; min-width: 5vh; text-align: center; }
  .sonos.attente .commandes, .sonos.attente .pochette { opacity: 0.6; }

  /* Tuile Foot (défilante : une diapo par équipe) */
  .foot { margin-top: 1.6vh; padding-top: 1.5vh; padding-bottom: 1.4vh; display: none; position: relative; }
  .foot.visible { display: block; }
  .foot .diapos { display: -ms-grid; display: grid; }
  .foot .diapo { grid-row: 1; grid-column: 1; min-width: 0; opacity: 0; visibility: hidden;
    -webkit-transform: translateX(2.5vw); transform: translateX(2.5vw);
    -webkit-transition: opacity 0.7s, -webkit-transform 0.7s, visibility 0s 0.7s; transition: opacity 0.7s, transform 0.7s, visibility 0s 0.7s; }
  .foot .diapo.on { opacity: 1; visibility: visible; -webkit-transform: none; transform: none;
    -webkit-transition: opacity 0.7s 0.25s, -webkit-transform 0.7s 0.25s; transition: opacity 0.7s 0.25s, transform 0.7s 0.25s; }
  .foot .points { position: absolute; right: 2vw; bottom: 2.1vh; line-height: 0; }
  .foot.plusieurs .diapo .ligne:last-child { padding-right: 4.5vw; }
  .foot .pt { display: inline-block; width: 0.8vh; height: 0.8vh; border-radius: 50%; background: rgba(255,255,255,0.28); margin: 0 0.35vh; }
  .foot .pt.on { background: #fff; }
  .ecu { display: inline-block; width: 2.6vh; height: 2.6vh; border-radius: 50%; background: #fff; margin-right: 0.6vw;
    vertical-align: -0.45vh; overflow: hidden; text-align: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ecu img { width: 80%; height: 80%; margin-top: 10%; -o-object-fit: contain; object-fit: contain; display: inline-block; vertical-align: top; }
  .ecu.droite { margin-right: 0; margin-left: 0.6vw; }
  .ecu.grand { width: 4.2vh; height: 4.2vh; margin-right: 0.9vw; }
  .foot .haut .etiquette b { font-weight: 600; }
  .foot .diapo .score { font-size: 3.1vh; }
  .foot .diapo .haut .etiquette { letter-spacing: 0.14em; }
  .foot .haut { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .foot .forme { white-space: nowrap; margin-left: 1vw; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .foot .haut .etiquette { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .foot .forme span { display: inline-block; width: 2.3vh; height: 2.3vh; line-height: 2.3vh; border-radius: 50%;
    font-size: 1.35vh; font-weight: 600; text-align: center; margin-left: 0.35vw; color: #0b1026; }
  .foot .forme .V { background: #5fd38d; } .foot .forme .N { background: #c9cbd6; } .foot .forme .D { background: #ff7b6b; }
  .foot .score { font-size: 3.4vh; font-weight: 300; margin-top: 0.7vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .score b { font-weight: 500; }
  .foot .score .quand { font-size: 2vh; opacity: 0.6; margin-left: 0.8vw; }
  .foot .ligne { font-size: 1.95vh; font-weight: 300; margin-top: 0.55vh; line-height: 1.3; opacity: 0.85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .ligne .eux { opacity: 0.6; }
  .foot .ligne svg { width: 1.8vh; height: 1.8vh; vertical-align: -0.25vh; margin-right: 0.4vw; }
  .foot .direct { color: #ff8a7a; font-weight: 600; }
  .foot .direct i { display: inline-block; width: 1vh; height: 1vh; border-radius: 50%; background: #ff5a48; margin-right: 0.5vw;
    -webkit-animation: clignote 1.4s infinite; animation: clignote 1.4s infinite; }
  @-webkit-keyframes clignote { 50% { opacity: 0.25; } } @keyframes clignote { 50% { opacity: 0.25; } }

  /* Panneau Lumières & volets (Delta Dore) */
  #btn-maison { position: fixed; top: 3.4vh; right: 2.4vw; width: 6.6vh; height: 6.6vh; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); display: none; z-index: 5;
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #btn-maison.visible { display: block; }
  #btn-maison svg { display: block; width: 52%; height: 52%; margin: 24% auto 0; }
  #btn-maison .badge { position: absolute; top: -0.6vh; right: -0.6vh; min-width: 2.6vh; height: 2.6vh; line-height: 2.6vh;
    border-radius: 2vh; background: #ffd36b; color: #2a2000; font-size: 1.6vh; font-weight: 600; text-align: center; padding: 0 0.4vh; }
  #btn-maison .badge:empty { display: none; }
  #maison { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; display: none;
    background: #080c22; padding: 5vh 4.5vw; box-sizing: border-box; overflow: hidden; }
  #maison.ouvert { display: block; }
  #maison .entete { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  #maison h1 { font-size: 4.6vh; font-weight: 200; margin: 0; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  #maison .action { -webkit-appearance: none; border: 0; outline: none; color: #fff; font: inherit; font-size: 2.1vh;
    background: rgba(255,255,255,0.12); border-radius: 100px; padding: 1.2vh 1.8vw; margin-left: 1vw; }
  #maison .action:active, #maison .fermer:active { background: rgba(255,255,255,0.3); }
  #maison .fermer { -webkit-appearance: none; border: 0; outline: none; color: #fff; width: 6.6vh; height: 6.6vh;
    border-radius: 50%; background: rgba(255,255,255,0.12); margin-left: 1.6vw; font-size: 3.6vh; line-height: 6.6vh; padding: 0; }
  #maison .rubrique { margin: 3.2vh 0 1.4vh; }
  #maison .grille { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-right: -1.4vw; }
  #maison .eq { width: 21.6vw; margin: 0 1.4vw 1.4vw 0; box-sizing: border-box; position: relative;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-transition: background 0.2s; transition: background 0.2s; }
  #maison .eq .n { font-size: 2.6vh; font-weight: 400; margin-top: 1vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #maison .eq .e { font-size: 1.9vh; font-weight: 300; opacity: 0.65; margin-top: 0.3vh; }
  #maison .lum { padding: 2.2vh 1.6vw; }
  #maison .lum svg { display: block; width: 6vh; height: 6vh; }
  #maison .lum.on { background: rgba(255,211,107,0.22); border-color: rgba(255,211,107,0.55); }
  #maison .lum:active { background: rgba(255,255,255,0.25); }
  #maison .vol { padding: 2vh 1.6vw 1.8vh; }
  #maison .vol .jauge { height: 0.8vh; border-radius: 1vh; background: rgba(255,255,255,0.15); margin-top: 1.2vh; overflow: hidden; }
  #maison .vol .jauge i { display: block; height: 100%; background: #8fc6ff; border-radius: 1vh; }
  #maison .vol .bts { display: -webkit-box; display: -webkit-flex; display: flex; margin-top: 1.4vh;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; }
  #maison .vol button { -webkit-appearance: none; border: 0; outline: none; padding: 0; color: #fff;
    width: 5.6vh; height: 5.6vh; border-radius: 50%; background: rgba(255,255,255,0.13);
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #maison .vol button svg { display: block; width: 46%; height: 46%; margin: 0 auto; fill: currentColor; }
  #maison .vol button:active { background: rgba(255,255,255,0.35); }
  #maison .vide { font-size: 2.4vh; font-weight: 300; opacity: 0.7; margin-top: 4vh; }

  /* Agenda (Google, via le relais) */
  .agenda { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.2vh; display: none; }
  .agenda.visible { display: block; }
  body.musique.agenda-on .heure { font-size: 16.5vh; }
  .agenda .arow { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: baseline; -webkit-align-items: baseline; align-items: baseline;
    padding-top: 0.75vh; font-size: 2.1vh; font-weight: 300; }
  .agenda .aquand { width: 9.5vw; -webkit-flex-shrink: 0; flex-shrink: 0; font-weight: 500; }
  .agenda .aquand.dem { font-weight: 300; opacity: 0.7; }
  .agenda .atitre { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda .alieu { opacity: 0.55; }
  .agenda .encours { color: #ffd36b; }

  /* 3 interrupteurs sur l'écran principal */
  .lumieres { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.6vh; display: none; }
  .lumieres.visible { display: block; }
  body.musique .lumieres { display: none; }
  .lumieres .rang { display: -webkit-box; display: -webkit-flex; display: flex; margin-top: 1vh; }
  .lumieres .bt { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; margin-right: 1.2vw; border-radius: 16px; padding: 1.2vh 1vw;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); -webkit-tap-highlight-color: rgba(0,0,0,0);
    display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-transition: background 0.2s, -webkit-transform 0.12s; transition: background 0.2s, transform 0.12s; min-width: 0; }
  .lumieres .bt:last-child { margin-right: 0; }
  .lumieres .bt:active { -webkit-transform: scale(0.95); transform: scale(0.95); }
  .lumieres .bt svg { width: 3.6vh; height: 3.6vh; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .lumieres .bt .t { margin-left: 0.5vw; min-width: 0; }
  .lumieres .bt .n { font-size: 2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lumieres .bt .e { font-size: 1.7vh; font-weight: 300; opacity: 0.65; }
  .lumieres .bt.on { background: rgba(255,211,107,0.22); border-color: rgba(255,211,107,0.55); }

  /* ---------- Ambiance animée (légère pour iOS 12 : transform + opacity seulement) ---------- */
  #ambiance { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; }
  .goutte { position: absolute; top: -12vh; width: 1.5px; height: 8vh; opacity: 0.5; border-radius: 2px;
    background: -webkit-linear-gradient(top, rgba(200,228,255,0), rgba(200,228,255,1)); background: linear-gradient(to bottom, rgba(200,228,255,0), rgba(200,228,255,1));
    -webkit-animation: chute linear infinite; animation: chute linear infinite; }
  .flocon { position: absolute; top: -3vh; -webkit-animation: chute linear infinite; animation: chute linear infinite; }
  .flocon i { display: block; width: 0.8vh; height: 0.8vh; border-radius: 50%; background: #fff; opacity: 0.75;
    -webkit-animation: balance 3s ease-in-out infinite alternate; animation: balance 3s ease-in-out infinite alternate; }
  @-webkit-keyframes chute { from { -webkit-transform: translate3d(0,0,0); } to { -webkit-transform: translate3d(-3vw,118vh,0); } }
  @keyframes chute { from { transform: translate3d(0,0,0); } to { transform: translate3d(-3vw,118vh,0); } }
  @-webkit-keyframes balance { from { -webkit-transform: translateX(-1.2vw); } to { -webkit-transform: translateX(1.2vw); } }
  @keyframes balance { from { transform: translateX(-1.2vw); } to { transform: translateX(1.2vw); } }
  .nuage { position: absolute; left: 0; width: 46vw; height: 16vh; border-radius: 50%; background: rgba(255,255,255,0.055);
    box-shadow: 9vw -3vh 0 1vh rgba(255,255,255,0.04), -7vw 1vh 0 -1vh rgba(255,255,255,0.04);
    -webkit-animation: derive linear infinite; animation: derive linear infinite; }
  @-webkit-keyframes derive { from { -webkit-transform: translate3d(-60vw,0,0); } to { -webkit-transform: translate3d(120vw,0,0); } }
  @keyframes derive { from { transform: translate3d(-60vw,0,0); } to { transform: translate3d(120vw,0,0); } }
  .filante { position: absolute; width: 14vw; height: 2px; border-radius: 2px; opacity: 0;
    background: -webkit-linear-gradient(left, rgba(255,255,255,0), #fff); background: linear-gradient(to right, rgba(255,255,255,0), #fff);
    -webkit-transform: rotate(-24deg); transform: rotate(-24deg); }
  .filante.go { -webkit-animation: file 1.3s ease-out; animation: file 1.3s ease-out; }
  @-webkit-keyframes file { 0% { opacity: 0; -webkit-transform: rotate(-24deg) translateX(0); } 15% { opacity: 1; }
    100% { opacity: 0; -webkit-transform: rotate(-24deg) translateX(30vw); } }

              [23.99, "Dernier quartier"], [27.68, "Dernier croissant"], [99, "Nouvelle lune"]];
  var nom = "";
  for (var i = 0; i < noms.length; i++) { if (age < noms[i][0]) { nom = noms[i][1]; break; } }

/* ---------- Course du soleil ---------- */

/* ---------- Pluie dans les 2 prochaines heures ---------- */
function afficherPluie(mm) {
  var z = el("pluie");
  if (!mm || !mm.time) { z.innerHTML = ""; return; }
  var now = new Date().getTime(), t = [], v = [], i;
  for (i = 0; i < mm.time.length && t.length < 8; i++) {
    var d = parseISO(mm.time[i]);
    if (d.getTime() + 15 * 60000 <= now) continue;
    t.push(d); v.push(mm.precipitation[i] || 0);
  }
  if (!v.length) { z.innerHTML = ""; return; }
  var SEUIL = 0.1, max = 0.6, txt;
  for (i = 0; i < v.length; i++) if (v[i] > max) max = v[i];
  if (v[0] >= SEUIL) {
    var fin = -1;
    for (i = 1; i < v.length; i++) if (v[i] < SEUIL) { fin = i; break; }
    txt = fin < 0 ? "Il pleut, et ça va durer au moins 2 h" : "Il pleut, jusque vers " + hm(t[fin]);
  } else {
    var deb = -1;
    for (i = 1; i < v.length; i++) if (v[i] >= SEUIL) { deb = i; break; }
    txt = deb < 0 ? "Pas de pluie dans les 2 prochaines heures"
                  : "Pluie vers " + hm(t[deb]) + ' <span class="dans">· dans ' +
                    Math.max(5, Math.round((t[deb].getTime() - now) / 300000) * 5) + " min</span>";
  }
  var b = "";
  for (i = 0; i < v.length; i++) {
    var on = v[i] >= SEUIL;
    b += '<span class="b' + (on ? ' on' : '') + '" style="height:' + (on ? Math.max(25, Math.round(v[i] / max * 100)) : 12) + '%"></span>';
  }
  z.innerHTML = '<span class="barres">' + b + '</span><span class="txt">' + txt + '</span>';
}

// Conseil du matin (7h–8h30) d'après la météo heure par heure : pluie, neige, gel
function conseilMatin(now) {
  var m = etatMeteo;
  if (!m || !m.hourly || !m.hourly.time) return null;
  var jours = CONFIG.departJours || [1, 2, 3, 4, 5], minutes = now.getHours() * 60 + now.getMinutes();
  if (jours.indexOf(now.getDay()) < 0 || minutes < (CONFIG.departDebut || 7 * 60) || minutes > (CONFIG.departFin || 8 * 60 + 30)) return null;
  var H = m.hourly, cle = now.getFullYear() + "-" + deux(now.getMonth() + 1) + "-" + deux(now.getDate()) + "T";
  var pluie = null, neige = null, tmin = 99;
  for (var i = 0; i < H.time.length; i++) {
    if (H.time[i].indexOf(cle) !== 0) continue;
    var h = +H.time[i].substr(11, 2);
    if (h >= 6 && h <= 9 && H.temperature_2m[i] < tmin) tmin = H.temperature_2m[i];
    if (h < now.getHours() || h > 19) continue;
    var c = H.weather_code[i], p = H.precipitation_probability ? H.precipitation_probability[i] : 0, q = H.precipitation ? H.precipitation[i] : 0;
    var nv = (c >= 71 && c <= 77) || c === 85 || c === 86;
    if (nv && (p >= 40 || q >= 0.2) && neige === null) neige = h;
    else if (!nv && (p >= 50 || q >= 0.3) && pluie === null) pluie = h;
  }
  if (neige !== null) return { ic: "&#10052;&#65039;", t: "Neige", s: (neige <= now.getHours() ? "en ce moment" : "vers " + neige + "h") + " : prudence sur la route", froid: true };
  if (tmin <= 0.5) return { ic: "&#129482;", t: "Gel ce matin", s: Math.round(tmin) + "° : pense à gratter le pare-brise", froid: true };
  if (pluie !== null) return { ic: "&#9730;&#65039;", t: "Parapluie", s: pluie <= now.getHours() ? "il pleut en ce moment" : "pluie prévue vers " + pluie + "h" };
  if (tmin <= 3) return { ic: "&#129507;", t: "Ça pince", s: Math.round(tmin) + "° ce matin : bonnet et écharpe" };
  return null;
}

    (d.estime ? '<div class="note-fff">Temps de jeu estimé · score ' + (d.sd === null || d.sd === undefined ? "publié par la FFF en fin de match" : "transmis par la FFF") + "</div>" : "") +
    bandeauAutres();
}

// Maillot du buteur (dessin, pas de photo) : nom et numéro dans le dos, aux couleurs du club
function maillotSVG(nom, numero, coul) {
  nom = (nom || "").toUpperCase();

    '<path d="M30 4 Q50 12 70 4 L94 16 L100 42 L82 46 L80 106 H20 L18 46 L0 42 L6 16 Z" fill="url(#mg)" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>' +
    '<path d="M30 4 Q50 12 70 4" stroke="' + coul[2] + '" stroke-width="3" fill="none"/><path d="M6 16 L0 42 L4 42.6 L9.5 17.5Z M94 16 L100 42 L96 42.6 L90.5 17.5Z" fill="' + coul[2] + '"/>' +
    '<text x="50" y="34" text-anchor="middle" font-family="-apple-system, Helvetica, Arial" font-weight="800" font-size="' + t + '" fill="#fff" letter-spacing="0.6">' + echap(nom) + "</text>" +
    (numero ? '<text x="50" y="88" text-anchor="middle" font-family="-apple-system, Helvetica, Arial" font-weight="800" font-size="46" fill="#fff" stroke="' + coul[2] + '" stroke-width="1.6">' + echap(String(numero)) + "</text>"
      : '<g transform="translate(50 66)"><circle r="17" fill="none" stroke="#fff" stroke-width="3"/><path d="M0 -7 L6.6 -2.2 L4.1 5.7 H-4.1 L-6.6 -2.2Z" fill="#fff"/></g>') + "</svg>";
}
// étincelles froides (gerbes comme dans les stades) et flammes au bas de l'écran
function feuxBut() {
  var h = "", pos = [5, 18, 31, 69, 82, 95];
  for (var g = 0; g < pos.length; g++) {
    h += '<div class="gerbe" style="left:' + pos[g] + 'vw">';
    for (var i = 0; i < 20; i++) {
      var an = g < 3 ? (i % 3 === 0 ? "etinM" : i % 3 === 1 ? "etinM2" : "etinG") : (i % 3 === 0 ? "etinM" : i % 3 === 1 ? "etinM2" : "etinD");
      h += '<i style="animation:' + an + " " + (0.9 + (i % 5) * 0.14).toFixed(2) + "s linear infinite;animation-delay:-" + (i * 0.067).toFixed(2) + 's"></i>';
    }
    h += "</div>";
  }
  var f = '<div class="flammes">';
  for (var k = 0; k < 13; k++) {
    var x = k * 8 - 2, ht = 9 + (k % 3) * 4 + (k === 6 ? 3 : 0);
    f += '<svg class="flamme" viewBox="0 0 40 80" preserveAspectRatio="none" style="left:' + x + "vw;width:11vw;height:" + ht + "vh;animation-delay:-" + ((k * 0.13) % 0.5).toFixed(2) + 's">' +
      '<path d="M20 2 C26 18 38 28 36 50 C34 70 26 78 20 78 C14 78 6 70 4 52 C2 36 12 30 14 16 C16 24 19 26 20 2Z" fill="#ff6a1a" opacity="0.85"/>' +
      '<path d="M20 26 C24 36 31 44 29 58 C28 70 24 76 20 76 C16 76 12 70 11 60 C10 50 16 46 17 38 C18 44 20 44 20 26Z" fill="#ffc23d"/>' +
      '<path d="M20 50 C22 56 25 60 24 68 C23 74 21 76 20 76 C19 76 17 74 16 69 C15 63 19 60 20 50Z" fill="#fff3c4"/></svg>';
  }
  return h + f + "</div>";
}
// deux buts en même temps (deux matchs en direct) : le second attend la fin du premier
var butsEnAttente = [], butEnCours = false;
function celebrerBut(pourNous, but, adversaire, dd) {
  dd = dd || footDirect;
  if (!CONFIG.animerIcones) return;
  if (butEnCours) { if (butsEnAttente.length < 4) butsEnAttente.push([pourNous, but, adversaire, dd]); return; }
  butEnCours = true;
  var z = el("but");
  z.className = "";
  var lg = logoNous(dd), maillot = pourNous && but && !but.csc && CONFIG.maillotBut !== false;
  z.innerHTML = '<div class="flash"></div>' + (pourNous ? '<div class="onde"></div><div class="onde" style="-webkit-animation-delay:.5s;animation-delay:.5s"></div>' : "") +
    (maillot ? '<div class="halo"></div>' + feuxBut() + '<div class="maillot">' + maillotSVG(but.famille || but.nom, but.numero, dd && dd.couleurs) + "</div>" +
      '<div class="minute">' + echap(but.nom) + " · " + echap(but.min) + "</div>" : "") +
    (pourNous && lg ? '<img class="ecusson" src="' + echap(lg) + '" alt="">' : "") +
    '<div class="mot">' + (pourNous ? "BUT !" : "But " + (adversaire ? "de " + echap(adversaire) : "adverse")) + "</div>" +
    (but ? '<div class="qui">' + echap(but.nom) + " · " + echap(but.min) + "</div>" : "");
  setTimeout(function () { z.className = "go" + (pourNous ? (maillot ? " nous" : "") : " eux"); }, 30);
  setTimeout(function () {
    z.className = ""; z.innerHTML = ""; butEnCours = false;
    var s = butsEnAttente.shift();
    if (s) setTimeout(function () { celebrerBut(s[0], s[1], s[2], s[3]); }, 600);
  }, maillot ? 13300 : 12300);
}

/* ---------- Rechargement automatique ----------
   Le relais du NAS remplace index.html quand une nouvelle version est publiée :
   la page vérifie toutes les 30 min si elle a changé et se recharge. Rechargement aussi chaque nuit à 3h. */
var signaturePage = null;
function signature(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ":" + h; }
// Recharge avec une adresse nouvelle : l'icône d'écran d'accueil d'iOS garde sinon l'ancienne page en cache.
function recharger() { location.replace(location.pathname + "?v=" + new Date().getTime() + location.hash); }
function verifierVersion() {
  if (location.protocol === "file:" || location.hash === "#demo") return;
  var x = new XMLHttpRequest();
  x.open("GET", "index.html?v=" + new Date().getTime(), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200 || x.responseText.length < 5000) return;
    var s = signature(x.responseText);
    if (signaturePage === null) signaturePage = s;
    else if (s !== signaturePage) recharger();
  };
  try { x.send(); } catch (e) {}
}
setInterval(function () {
  var d = new Date();
  if (d.getHours() === 3 && d.getMinutes() === 0 && d.getSeconds() < 2) recharger();
}, 1000);
setInterval(verifierVersion, 30 * 60000);
verifierVersion();

/* ---------- Démarrage ---------- */
// Si Safari a dû relancer la page plusieurs fois en peu de temps (manque de mémoire sur le vieil iPad),
// on passe en mode léger pour la journée : pas de webcams ni d'animations décoratives.
(function () {
  try {
    var t = new Date().getTime(), l = JSON.parse(localStorage.getItem("ecran-demarrages") || "[]"), r = [];
    for (var i = 0; i < l.length; i++) if (t - l[i] < 5 * 60000) r.push(l[i]);
    r.push(t);
    localStorage.setItem("ecran-demarrages", JSON.stringify(r));
    var leger = +localStorage.getItem("ecran-leger-jusque") || 0;
    if (r.length >= 3) { leger = t + 12 * 3600000; localStorage.setItem("ecran-leger-jusque", String(leger)); }
    if (t < leger || location.hash === "#leger") CONFIG.modeLeger = true;
  } catch (e) {}
})();

<title>Écran maison</title>
<!--

  JavaScript "ancien" (ES5) et CSS simple, pour les vieux moteurs web.
  Météo : Open-Meteo (gratuit, sans clé).
  RÉGLAGES : modifiez uniquement le bloc CONFIG dans le script.
  Aperçu avec des données fictives : ajoutez #demo à la fin de l'adresse.
-->
<style>

  .collecte .crow:first-of-type { padding-top: 0.7vh; }
  .collecte .cquand { font-size: 2vh; font-weight: 300; }

  /* Musique en cours (Sonos) */

  .sonos button svg { display: block; width: 44%; height: 44%; margin: 0 auto; fill: currentColor; }
  .sonos button.lecture { width: 7vh; height: 7vh; background: #fff; color: #0b1026; }
  .sonos button:active { -webkit-transform: scale(0.88); transform: scale(0.88); background: rgba(255,255,255,0.3); }
  .sonos button.lecture:active { background: #d8dcf0; }
  .sonos .vol { margin-left: auto; display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .sonos .vol button { margin: 0; width: 4.8vh; height: 4.8vh; }
  .sonos .vol span { font-size: 2.3vh; font-weight: 300; min-width: 4.6vh; text-align: center; }
  .sonos.attente .commandes, .sonos.attente .pochette { opacity: 0.6; }

  /* Tuile PSG */
  .foot { margin-top: 1.6vh; padding-top: 1.5vh; padding-bottom: 1.4vh; display: none; }
  .foot.visible { display: block; }
  .foot .haut { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .foot .forme { white-space: nowrap; margin-left: 1vw; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .foot .haut .etiquette { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .foot .forme span { display: inline-block; width: 2.3vh; height: 2.3vh; line-height: 2.3vh; border-radius: 50%;
    font-size: 1.35vh; font-weight: 600; text-align: center; margin-left: 0.35vw; color: #0b1026; }
  .foot .forme .V { background: #5fd38d; } .foot .forme .N { background: #c9cbd6; } .foot .forme .D { background: #ff7b6b; }
  .foot .score { font-size: 3.4vh; font-weight: 300; margin-top: 0.7vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .score b { font-weight: 500; }
  .foot .score .quand { font-size: 2vh; opacity: 0.6; margin-left: 0.8vw; }
  .foot .ligne { font-size: 1.95vh; font-weight: 300; margin-top: 0.55vh; line-height: 1.3; opacity: 0.85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .ligne .eux { opacity: 0.6; }
  .foot .ligne svg { width: 1.8vh; height: 1.8vh; vertical-align: -0.25vh; margin-right: 0.4vw; }
  .foot .direct { color: #ff8a7a; font-weight: 600; }
  .foot .direct i { display: inline-block; width: 1vh; height: 1vh; border-radius: 50%; background: #ff5a48; margin-right: 0.5vw;
    -webkit-animation: clignote 1.4s infinite; animation: clignote 1.4s infinite; }
  @-webkit-keyframes clignote { 50% { opacity: 0.25; } } @keyframes clignote { 50% { opacity: 0.25; } }

  /* Panneau Lumières & volets (Delta Dore) */
  #btn-maison { position: fixed; top: 3.4vh; right: 2.4vw; width: 6.6vh; height: 6.6vh; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); display: none; z-index: 5;
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #btn-maison.visible { display: block; }
  #btn-maison svg { display: block; width: 52%; height: 52%; margin: 24% auto 0; }
  #btn-maison .badge { position: absolute; top: -0.6vh; right: -0.6vh; min-width: 2.6vh; height: 2.6vh; line-height: 2.6vh;
    border-radius: 2vh; background: #ffd36b; color: #2a2000; font-size: 1.6vh; font-weight: 600; text-align: center; padding: 0 0.4vh; }
  #btn-maison .badge:empty { display: none; }
  #maison { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; display: none;
    background: #080c22; padding: 5vh 4.5vw; box-sizing: border-box; overflow: hidden; }
  #maison.ouvert { display: block; }
  #maison .entete { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  #maison h1 { font-size: 4.6vh; font-weight: 200; margin: 0; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  #maison .action { -webkit-appearance: none; border: 0; outline: none; color: #fff; font: inherit; font-size: 2.1vh;
    background: rgba(255,255,255,0.12); border-radius: 100px; padding: 1.2vh 1.8vw; margin-left: 1vw; }
  #maison .action:active, #maison .fermer:active { background: rgba(255,255,255,0.3); }
  #maison .fermer { -webkit-appearance: none; border: 0; outline: none; color: #fff; width: 6.6vh; height: 6.6vh;
    border-radius: 50%; background: rgba(255,255,255,0.12); margin-left: 1.6vw; font-size: 3.6vh; line-height: 6.6vh; padding: 0; }
  #maison .rubrique { margin: 3.2vh 0 1.4vh; }
  #maison .grille { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-right: -1.4vw; }
  #maison .eq { width: 21.6vw; margin: 0 1.4vw 1.4vw 0; box-sizing: border-box; position: relative;
    -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-transition: background 0.2s; transition: background 0.2s; }
  #maison .eq .n { font-size: 2.6vh; font-weight: 400; margin-top: 1vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #maison .eq .e { font-size: 1.9vh; font-weight: 300; opacity: 0.65; margin-top: 0.3vh; }
  #maison .lum { padding: 2.2vh 1.6vw; }
  #maison .lum svg { display: block; width: 6vh; height: 6vh; }
  #maison .lum.on { background: rgba(255,211,107,0.22); border-color: rgba(255,211,107,0.55); }
  #maison .lum:active { background: rgba(255,255,255,0.25); }
  #maison .vol { padding: 2vh 1.6vw 1.8vh; }
  #maison .vol .jauge { height: 0.8vh; border-radius: 1vh; background: rgba(255,255,255,0.15); margin-top: 1.2vh; overflow: hidden; }
  #maison .vol .jauge i { display: block; height: 100%; background: #8fc6ff; border-radius: 1vh; }
  #maison .vol .bts { display: -webkit-box; display: -webkit-flex; display: flex; margin-top: 1.4vh;
    -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; }
  #maison .vol button { -webkit-appearance: none; border: 0; outline: none; padding: 0; color: #fff;
    width: 5.6vh; height: 5.6vh; border-radius: 50%; background: rgba(255,255,255,0.13);
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  #maison .vol button svg { display: block; width: 46%; height: 46%; margin: 0 auto; fill: currentColor; }
  #maison .vol button:active { background: rgba(255,255,255,0.35); }
  #maison .vide { font-size: 2.4vh; font-weight: 300; opacity: 0.7; margin-top: 4vh; }

  /* Agenda (Google, via le relais) */
  .agenda { margin-top: 1.8vh; padding-top: 1.4vh; padding-bottom: 1.2vh; display: none; }
  .agenda.visible { display: block; }
  body.agenda-on .heure { font-size: 18.5vh; }
  body.agenda-on .fete { padding-top: 1.3vh; padding-bottom: 1.3vh; }
  body.agenda-on .fete .nom { font-size: 3.5vh; }
  .agenda .arow { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: baseline; -webkit-align-items: baseline; align-items: baseline;
    padding-top: 0.75vh; font-size: 2.1vh; font-weight: 300; }
  .agenda .aquand { width: 9.5vw; -webkit-flex-shrink: 0; flex-shrink: 0; font-weight: 500; }
  .agenda .aquand.dem { font-weight: 300; opacity: 0.7; }
  .agenda .atitre { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda .alieu { opacity: 0.55; }
  .agenda .encours { color: #ffd36b; }

  /* Météo */
  .actuel {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    margin-top: 0.8vh;
  }
  .grande-icone svg { display: block; width: 17vh; height: 17vh; }
  .temp { font-size: 18vh; font-weight: 100; line-height: 1; margin-left: 1.5vw; letter-spacing: -0.03em; }
  .temp sup { font-size: 7.5vh; font-weight: 200; vertical-align: top; position: relative; top: 2vh; margin-left: 0.3vw; }
  .desc { font-size: 4.2vh; font-weight: 300; margin-top: 0.3vh; }
  .alerte { display: inline-block; vertical-align: middle; font-size: 2.1vh; font-weight: 400;
    color: #ffe1b0; background: rgba(255,150,40,0.30); border-radius: 100px;
    padding: 0.6vh 1.2vw; margin-left: 1vw; position: relative; top: -0.4vh; }
  .alerte b { font-weight: 600; }
  .pastilles { margin-top: 1.6vh; }

  /* Pluie dans les 2 heures */
  .pluie-h { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-top: 0.4vh; }
  .pluie-h .barres { display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: end; -webkit-align-items: flex-end; align-items: flex-end;
    height: 3.6vh; margin-right: 1.2vw; }
  .pluie-h .b { display: block; width: 0.7vw; margin-right: 0.3vw; border-radius: 2px; background: rgba(255,255,255,0.22); }
  .pluie-h .b.on { background: #8fc6ff; }
  .pluie-h .txt { font-size: 2.3vh; font-weight: 300; }
  .pluie-h .dans { opacity: 0.65; }

  /* Encadré d'infos qui défile */
  .infos { margin-top: 1.8vh; position: relative; }
  .infos .points { position: absolute; right: 2vw; top: 2.1vh; }
  .infos .pt { display: inline-block; width: 0.8vh; height: 0.8vh; border-radius: 50%;
    background: rgba(255,255,255,0.28); margin-left: 0.6vh; }
  .infos .pt.on { background: #fff; }
  .infos .contenu { min-height: 10.5vh; -webkit-transition: opacity 0.45s; transition: opacity 0.45s; }
  .infos .contenu.cache { opacity: 0; }
  .infos .grand { font-size: 3.5vh; font-weight: 300; margin-top: 0.7vh; line-height: 1.2; }
  .infos .vignette { float: right; width: 10vh; height: 10vh; border-radius: 10px; margin: 0.8vh 0 0 1.4vw;
    background: rgba(255,255,255,0.1) center/cover no-repeat; }
  .infos .actu .grand { font-size: 2.7vh; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .infos .actu .petit { font-size: 1.95vh; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .infos .petit { font-size: 2.1vh; font-weight: 300; opacity: 0.72; margin-top: 0.6vh; line-height: 1.3; }
  .tag { display: inline-block; font-size: 1.9vh; font-weight: 500; padding: 0.3vh 0.9vw;

  .tag.v { background: rgba(95,211,141,0.30); color: #c9f5d9; }
  .tag.n { background: rgba(255,255,255,0.18); }
  .tag.d { background: rgba(255,107,90,0.30); color: #ffd0c9; }

  /* Anniversaire du jour (en petit, sous la fête) */
  .fete .sous { font-size: 2.2vh; color: #ffd36b; margin-top: 0.6vh; }
  .fete .sous:empty { display: none; }
  .pastille {
    display: inline-block;
    font-size: 2.2vh; font-weight: 300;
    background: rgba(255,255,255,0.10);
    border-radius: 100px; padding: 0.9vh 1.4vw; margin: 0 0.8vw 1vh 0;
  }
  .pastille b { font-weight: 500; }

  .prev {
    display: -webkit-box; display: -webkit-flex; display: flex;
    margin-top: 1.6vh;
  }
  .jour { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; margin-right: 1.2vw; padding: 1.2vh 1vw;
    display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .jour .txt { margin-left: 0.8vw; min-width: 0; }
  .jour:last-child { margin-right: 0; }
  .jour .nom { font-size: 2.3vh; font-weight: 400; opacity: 0.75; }

  .jour .max { font-size: 3.2vh; font-weight: 300; }

  .erreur { color: #ffb3a6; opacity: 1; }

<body>
<div id="ciel"></div>
<div id="etoiles"></div>
<div id="voile"></div>

<div class="page">
  <div class="col gauche">
    <div class="heure" id="heure">--:--</div>
    <div class="date" id="date"></div>
    <div class="sousdate" id="sousdate"></div>

    <div class="carte fete" id="fete-carte">
      <div class="etiquette" id="fete-titre">Bonne fête</div>
      <div class="nom" id="fete"></div>
      <div class="sous" id="fete-sous"></div>
    </div>

    <div class="carte collecte">
      <div class="etiquette">Collecte des déchets</div>
      <div id="collecte"></div>
    </div>

    <div class="carte agenda" id="agenda-carte">
      <div class="etiquette" id="agenda-titre">Agenda</div>
      <div id="agenda"></div>
    </div>

    <div class="pousse"></div>


    <div class="carte sonos" id="sonos">
      <div class="pochette" id="sonos-pochette"></div>

function aBalance(a, cx, cy, dur) {

function aDerive(dx, dur) {

function rayons(cx, cy, r1, r2, ep) {

/* Codes météo WMO -> [texte, icône de jour, icône de nuit, couvert ?] */
function meteoInfo(c) {

  if (c === 51 || c === 53 || c === 55) return ["Bruine", "pluie", "pluie", true];
  if (c === 56 || c === 57) return ["Bruine verglaçante", "pluie", "pluie", true];
  if (c === 61) return ["Pluie faible", "pluie", "pluie", true];

/* ---------- Outils ---------- */
function el(id) { return document.getElementById(id); }
function deux(n) { return n < 10 ? "0" + n : "" + n; }
function bissextile(a) { return (a % 4 === 0 && a % 100 !== 0) || a % 400 === 0; }
function jourDeLAnnee(d) {
  var debut = new Date(d.getFullYear(), 0, 1);
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - debut) / 86400000) + 1;
}
function semaineISO(d) {
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var jour = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - jour);
  var debut = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - debut) / 86400000 + 1) / 7);
}
/* "2026-11-18T07:59" -> minutes depuis minuit, sans dépendre du navigateur */
function minutesISO(s) { return parseInt(s.substr(11, 2), 10) * 60 + parseInt(s.substr(14, 2), 10); }
function heureMin(m) { return deux(Math.floor(m / 60)) + "h" + deux(m % 60); }
function jourISO(s) {
  return new Date(parseInt(s.substr(0, 4), 10), parseInt(s.substr(5, 2), 10) - 1, parseInt(s.substr(8, 2), 10));
}

/* ---------- Lune ---------- */
function infoLune(d) {
  var cycle = 29.530588853;
  var age = ((d.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000) % cycle;
  if (age < 0) age += cycle;
  var k = Math.cos(2 * Math.PI * age / cycle);
  var eclat = Math.round((1 - k) / 2 * 100);
  var noms = [[1.84, "Nouvelle lune"], [5.53, "Premier croissant"], [9.22, "Premier quartier"],
              [12.91, "Lune gibbeuse croissante"], [16.61, "Pleine lune"], [20.30, "Lune gibbeuse décroissante"],
              [23.99, "Dernier quartier"], [27.68, "Dernier croissant"], [99, "Nouvelle lune"]];
  var nom = "";
  for (var i = 0; i < noms.length; i++) { if (age < noms[i][0]) { nom = noms[i][1]; break; } }
  return { age: age, k: k, croissante: age < cycle / 2, eclat: eclat, nom: nom };
}
function svgLune(L) {
  var c = 50, r = 40, rx = Math.abs(L.k) * r;
  var p;
  if (L.croissante) {
    p = "M" + c + " " + (c - r) + " A" + r + " " + r + " 0 0 1 " + c + " " + (c + r) +
        " A" + rx.toFixed(2) + " " + r + " 0 0 " + (L.k > 0 ? 0 : 1) + " " + c + " " + (c - r) + "z";
  } else {
    p = "M" + c + " " + (c - r) + " A" + r + " " + r + " 0 0 0 " + c + " " + (c + r) +
        " A" + rx.toFixed(2) + " " + r + " 0 0 " + (L.k > 0 ? 1 : 0) + " " + c + " " + (c - r) + "z";
  }
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.12)"/>' +
    (L.eclat > 0 ? '<path d="' + p + '" fill="#f3ecd2"/>' : '') + '</svg>';
}

/* ---------- Course du soleil ---------- */
function svgArc(maintenant, lever, coucher) {
  var x0 = 18, x1 = 282, base = 104, h = 86;
  var t = (maintenant - lever) / (coucher - lever);
  var jour = t >= 0 && t <= 1;
  var tt = t < 0 ? 0 : (t > 1 ? 1 : t);
  function pt(f) {
    var a = Math.PI * f;
    return [(x0 + (x1 - x0) * (1 - Math.cos(a)) / 2), (base - h * Math.sin(a))];
  }
  var chemin = "", fait = "";
  for (var i = 0; i <= 40; i++) {
    var q = pt(i / 40);
    chemin += (i === 0 ? "M" : "L") + q[0].toFixed(1) + " " + q[1].toFixed(1) + " ";
    if (i / 40 <= tt) fait += (i === 0 ? "M" : "L") + q[0].toFixed(1) + " " + q[1].toFixed(1) + " ";
  }
  var s = pt(tt);
  if (jour) fait += "L" + s[0].toFixed(1) + " " + s[1].toFixed(1);
  return '<svg viewBox="0 0 300 116" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="4" y1="' + base + '" x2="296" y2="' + base + '" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>' +
    '<path d="' + chemin + '" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>' +
    (jour ? '<path d="' + fait + '" fill="none" stroke="#ffd36b" stroke-width="2.5" stroke-linecap="round"/>' +
            '<circle cx="' + s[0].toFixed(1) + '" cy="' + s[1].toFixed(1) + '" r="13" fill="rgba(255,211,107,0.25)"/>' +
            '<circle cx="' + s[0].toFixed(1) + '" cy="' + s[1].toFixed(1) + '" r="7.5" fill="#ffd36b"/>'
          : '') +
    '</svg>';
}

/* ---------- Ciel (couleur du fond selon l'heure et la météo) ---------- */
var etatSoleil = { lever: 7 * 60 + 45, coucher: 17 * 60 + 15, connu: false };
var couvert = false;

function phaseCiel(m) {
  var L = etatSoleil.lever, C = etatSoleil.coucher;

  if (v[0] >= SEUIL) {

  } else {

/* ---------- Musique en cours (Sonos, via le relais du NAS sur le port 8099) ----------
   La tuile remplace l'éphéméride pendant la lecture, et jusqu'à 15 min après une pause. */
var SVG_LECTURE = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>';
var SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>';

function urlSonos() {

  if (!visible) return;
  document.getElementById("sonos-piece").innerHTML = (enLecture(g) ? "En écoute" : "En pause") + " · " + echap(g.nom);
  document.getElementById("sonos-titre").innerHTML = echap(g.titre);
  document.getElementById("sonos-artiste").innerHTML = echap(g.artiste + (g.album && g.artiste ? " — " + g.album : g.album || ""));
  document.getElementById("sonos-lecture").innerHTML = enLecture(g) ? SVG_PAUSE : SVG_LECTURE;
  document.getElementById("sonos-vol").innerHTML = g.volume === null || g.volume === undefined ? "–" : g.volume;
  var p = document.getElementById("sonos-pochette");
  if (g.pochette !== sonosPochette) {
    sonosPochette = g.pochette;
    p.style.backgroundImage = g.pochette ? "url('" + g.pochette.replace(/'/g, "%27") + "')" : "none";
    p.innerHTML = g.pochette ? "" : SVG_NOTE;
  }

}
function majBarreSonos() {
  var g = sonosGroupe;
  if (!g || !g.duree) { document.getElementById("sonos-barre").style.width = "0"; return; }
  var pos = g.pos + (enLecture(g) ? (new Date().getTime() - sonosRecu) / 1000 : 0);
  document.getElementById("sonos-barre").style.width = Math.min(100, pos / g.duree * 100).toFixed(1) + "%";
}
function chargerSonos() {
  clearTimeout(sonosMinuteur);
  var u = urlSonos();
  if (location.hash === "#demo") { sonosGroupe = sonosGroupe || sonosDemo(); sonosRecu = sonosRecu || new Date().getTime(); afficherSonos(); return; }
  if (!u) return;
  chargerJSON(u + "/sonos?t=" + new Date().getTime(), function (d) {
    var l = d.groupes || [], joue = false;
    for (var i = 0; i < l.length; i++) if (enLecture(l[i])) joue = true;
    sonosMinuteur = setTimeout(chargerSonos, joue ? 5000 : 20000);
    if (new Date().getTime() - sonosOccupe > 1500) {
      sonosGroupe = choisirGroupe(l); sonosRecu = new Date().getTime(); afficherSonos();
    }
  }, function () {
    sonosMinuteur = setTimeout(chargerSonos, 60000);
  });
}
function cmdSonos(a) {
  var g = sonosGroupe;
  if (!g) return;
  if (a === "basculer") a = enLecture(g) ? "pause" : "play";
  // affichage immédiat, confirmé ensuite par l'enceinte
  if (a === "pause") { g.pos += (new Date().getTime() - sonosRecu) / 1000; g.etat = "PAUSED_PLAYBACK"; }
  if (a === "play") g.etat = "PLAYING";
  if (a === "volup" && g.volume !== null) g.volume = Math.min(100, g.volume + 3);
  if (a === "voldown" && g.volume !== null) g.volume = Math.max(0, g.volume - 3);
  sonosRecu = new Date().getTime(); sonosOccupe = sonosRecu;
  afficherSonos();
  if (location.hash === "#demo") { commandeDemo(a); return; }
  var el = document.getElementById("sonos");
  el.className = "carte sonos attente";
  chargerJSON(urlSonos() + "/sonos/cmd?id=" + encodeURIComponent(g.id) + "&a=" + a + "&t=" + sonosRecu, function (e) {
    el.className = "carte sonos";
    if (e && e.id) { sonosGroupe = e; sonosRecu = new Date().getTime(); afficherSonos(); }
    clearTimeout(sonosMinuteur); sonosMinuteur = setTimeout(chargerSonos, 1500);
  }, function () { el.className = "carte sonos"; chargerSonos(); });
}
function echap(t) { return String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function sonosDemo() {
  return { id: "demo", nom: "Salon + Cuisine", etat: "PLAYING", titre: "Get Lucky", artiste: "Daft Punk",
           album: "Random Access Memories", pochette: "", volume: 28, pos: 95, duree: 369 };
}
function commandeDemo(a) {
  var g = sonosGroupe;
  if (a === "next" || a === "prev") { g.titre = a === "next" ? "Midnight City" : "Get Lucky"; g.artiste = a === "next" ? "M83" : "Daft Punk"; g.pos = 0; }
  afficherSonos();
}
document.addEventListener("touchstart", function () {}, true);   // active :active sur iOS

/* ---------- Actualités des mairies (actus.json, écrit par le relais du NAS) ----------
   Les 3 plus récentes de moins de 30 jours (réglable : joursActus) rejoignent l'encadré qui défile. */
var etatActus = [];
function chargerActus() {
  setTimeout(chargerActus, 3 * 3600000);
  if (location.hash === "#demo") { etatActus = actusDemo(); construireInfos(); return; }
  if (!CONFIG.urlActus) return;
  chargerJSON(CONFIG.urlActus + "?t=" + new Date().getTime(), function (d) { etatActus = d || []; construireInfos(); });
}
function slidesActus(now) {
  var r = [], lim = now.getTime() - CONFIG.joursActus * 86400000;
  for (var i = 0; i < etatActus.length && r.length < 3; i++) {
    var a = etatActus[i], d = parseISO(a.date);
    if (!d || d.getTime() < lim) continue;
    r.push({ titre: "Actu · " + echap(a.source) + " · " + d.getDate() + " " + MOISCOURT[d.getMonth()],
             grand: echap(a.titre), petit: echap(a.resume), image: a.image, classe: "actu" });
  }
  return r;
}
function actusDemo() {
  return [{ source: "Chauvry", titre: "🍷🍇 À Chauvry, on se retrouve autour du Beaujolais nouveau !", date: "2026-11-06T11:55",

          { source: "Béthemont", titre: "Fête du Beaujolais – Samedi 28 novembre", date: "2026-10-27T17:36",
            resume: "Dans la cour de l'école. Réservation obligatoire, 12 € par personne.", image: "" }];
}

/* ---------- Agenda Google (agenda.json, écrit par le relais du NAS) ----------
   Rendez-vous d'aujourd'hui (pas encore terminés) puis de demain ; carte masquée s'il n'y a rien. */
var etatAgenda = [];
function chargerAgenda() {
  setTimeout(chargerAgenda, 15 * 60000);
  if (location.hash === "#demo") { etatAgenda = agendaDemo(); majAgenda(); return; }
  if (!CONFIG.urlAgenda) return;
  chargerJSON(CONFIG.urlAgenda + "?t=" + new Date().getTime(), function (d) { etatAgenda = d || []; majAgenda(); });
}
function majAgenda() {
  var now = new Date(), l = [], i, carte = el("agenda-carte");
  for (i = 0; i < etatAgenda.length; i++) {
    var e = etatAgenda[i], d = parseISO(e.debut), f = parseISO(e.fin), nj = joursEntre(now, d);
    if (f <= now) continue;
    if (nj > 1) continue;
    if (nj < 0) nj = 0;                     // commencé avant aujourd'hui, toujours en cours
    l.push({ e: e, d: d, f: f, nj: nj, encours: d <= now });
  }
  document.body.className = document.body.className.replace(/\s*agenda-on/g, "") + (l.length ? " agenda-on" : "");
  if (!l.length) { carte.className = "carte agenda"; return; }
  var n = CONFIG.agendaLignes, h = "", aujN = 0;
  for (i = 0; i < l.length; i++) if (l[i].nj === 0) aujN++;
  for (i = 0; i < l.length && i < n; i++) {
    var x = l[i], quand;
    if (x.e.journee) quand = x.nj === 0 ? "Aujourd'hui" : "Demain";
    else if (x.encours) quand = "En cours";
    else quand = (x.nj === 1 ? "Dem. " : "") + hm(x.d);
    h += '<div class="arow"><span class="aquand' + (x.nj === 1 ? " dem" : "") + (x.encours && !x.e.journee ? " encours" : "") + '">' + quand + "</span>" +
      '<span class="atitre">' + echap(x.e.titre) + (x.e.lieu ? ' <span class="alieu">· ' + echap(x.e.lieu) + "</span>" : "") + "</span></div>";
  }
  var reste = l.length - Math.min(n, l.length);
  el("agenda-titre").innerHTML = (aujN ? "Agenda · aujourd'hui" : "Agenda · demain") + (reste > 0 ? " · +" + reste : "");
  el("agenda").innerHTML = h;
  carte.className = "carte agenda visible";
}
setInterval(majAgenda, 60000);
function agendaDemo() {
  var d = new Date(), j = d.getFullYear() + "-" + deux(d.getMonth() + 1) + "-" + deux(d.getDate()),
      t = new Date(d.getTime() + 86400000), k = t.getFullYear() + "-" + deux(t.getMonth() + 1) + "-" + deux(t.getDate());
  return [{ titre: "Piscine Matt", lieu: "Piscine de Domont", debut: j + "T18:30", fin: j + "T19:30", journee: false },
          { titre: "Dîner chez Paul et Léa", lieu: "", debut: j + "T20:30", fin: j + "T23:00", journee: false },
          { titre: "Réunion école", lieu: "École", debut: k + "T08:45", fin: k + "T09:30", journee: false }];
}

/* ---------- Lumières & volets (Delta Dore, via le relais du NAS) ----------
   Bouton en haut à droite (avec le nombre de lumières allumées) → panneau plein écran.
   CONFIG.interrupteurs : liste des noms à afficher, dans l'ordre voulu (null = tous). */
var maisonEq = null, maisonOuvert = false, maisonMinuteur = null, maisonDerniereTouche = 0, maisonOccupe = 0;
var SVG_AMPOULE = function (on) {
  return '<svg viewBox="0 0 24 24" fill="' + (on ? "rgba(255,211,107,0.9)" : "none") + '" stroke="' + (on ? "#ffd36b" : "rgba(255,255,255,0.75)") +
    '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>' +
    '<path d="M9.5 18.5h5M10.5 21h3" fill="none"/></svg>';
};
var SVG_HAUT = '<svg viewBox="0 0 24 24"><path d="M12 6l7 9H5z"/></svg>', SVG_BAS = '<svg viewBox="0 0 24 24"><path d="M12 18l7-9H5z"/></svg>',
    SVG_STOP = '<svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></svg>';
function chargerMaison() {
  clearTimeout(maisonMinuteur);
  if (location.hash === "#demo") { maisonEq = maisonEq || maisonDemo(); afficherMaison(); return; }
  var u = urlSonos();
  if (!u) return;
  chargerJSON(u + "/maison?t=" + new Date().getTime(), function (d) {
    maisonMinuteur = setTimeout(chargerMaison, maisonOuvert ? 3000 : 60000);
    if (new Date().getTime() - maisonOccupe > 2500) { maisonEq = d.equipements || []; afficherMaison(); }
  }, function () { maisonMinuteur = setTimeout(chargerMaison, 5 * 60000); });
}
function choisis() {
  var l = maisonEq || [], c = CONFIG.interrupteurs, r = [];
  if (!c || !c.length) return l;
  for (var i = 0; i < c.length; i++) for (var j = 0; j < l.length; j++) if (l[j].nom === c[i]) r.push(l[j]);
  return r;
}
function afficherMaison() {
  var l = choisis(), nb = 0, lum = "", vol = "", i;
  document.getElementById("btn-maison").className = l.length ? "visible" : "";
  for (i = 0; i < l.length; i++) if (l[i].type === "lumiere" && l[i].allume) nb++;
  document.getElementById("badge-maison").innerHTML = nb || "";
  if (!maisonOuvert) return;
  for (i = 0; i < l.length; i++) {
    var e = l[i];
    if (e.type === "lumiere" || e.type === "prise") {
      lum += '<div class="carte eq lum' + (e.allume ? " on" : "") + '" onclick="cmdMaison(\'' + e.id + '\',\'basculer\')">' + SVG_AMPOULE(e.allume) +
        '<div class="n">' + echap(e.nom) + '</div><div class="e">' + (e.allume ? (e.niveau && e.niveau < 100 ? "Allumée " + e.niveau + " %" : "Allumée") : "Éteinte") + "</div></div>";
    } else if (e.type === "volet") {
      var p = e.position, txt = p === undefined || p === null ? "" : p >= 98 ? "Ouvert" : p <= 2 ? "Fermé" : "Ouvert à " + p + " %";
      vol += '<div class="carte eq vol"><div class="n">' + echap(e.nom) + '</div><div class="e">' + txt + "</div>" +
        '<div class="jauge"><i style="width:' + (p || 0) + '%"></i></div><div class="bts">' +
        '<button onclick="cmdMaison(\'' + e.id + '\',\'haut\')" aria-label="Monter">' + SVG_HAUT + "</button>" +
        '<button onclick="cmdMaison(\'' + e.id + '\',\'stop\')" aria-label="Arrêter">' + SVG_STOP + "</button>" +
        '<button onclick="cmdMaison(\'' + e.id + '\',\'bas\')" aria-label="Descendre">' + SVG_BAS + "</button></div></div>";
    }
  }
  document.getElementById("maison-contenu").innerHTML =
    (lum ? '<div class="etiquette rubrique">Lumières</div><div class="grille">' + lum + "</div>" : "") +
    (vol ? '<div class="etiquette rubrique">Volets</div><div class="grille">' + vol + "</div>" : "") +
    (!lum && !vol ? '<div class="vide">Aucun équipement Delta Dore trouvé.</div>' : "");
}
function trouverEq(id) { var l = maisonEq || []; for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
function cmdMaison(id, a) {
  var e = trouverEq(id);
  if (!e) return;
  // affichage immédiat
  if (a === "basculer") { e.allume = !e.allume; e.niveau = e.allume ? 100 : 0; }
  if (a === "off") { e.allume = false; e.niveau = 0; }
  if (a === "haut") e.position = 100;
  if (a === "bas") e.position = 0;
  maisonOccupe = new Date().getTime();
  afficherMaison();
  if (location.hash === "#demo") return;
  chargerJSON(urlSonos() + "/maison/cmd?id=" + encodeURIComponent(id) + "&a=" + a + "&t=" + maisonOccupe, function () {}, function () {});
}
function toutMaison(type) {
  var l = choisis();
  for (var i = 0; i < l.length; i++) {
    if (type === "lumiere" && (l[i].type === "lumiere") && l[i].allume) cmdMaison(l[i].id, "off");
    if (type === "volet" && l[i].type === "volet") cmdMaison(l[i].id, "bas");
  }
}
function ouvrirMaison() {
  maisonOuvert = true; maisonDerniereTouche = new Date().getTime();
  document.getElementById("maison").className = "ouvert";
  afficherMaison(); chargerMaison();
}
function fermerMaison(ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  maisonOuvert = false;
  document.getElementById("maison").className = "";
  chargerMaison();
}
function toucheMaison() { maisonDerniereTouche = new Date().getTime(); }
setInterval(function () { if (maisonOuvert && new Date().getTime() - maisonDerniereTouche > 60000) fermerMaison(); }, 5000);
function maisonDemo() {
  return [
    { id: "a", nom: "Salon", type: "lumiere", allume: true, niveau: 100 }, { id: "b", nom: "Cuisine", type: "lumiere", allume: false, niveau: 0 },
    { id: "c", nom: "Entrée", type: "lumiere", allume: false, niveau: 0 }, { id: "d", nom: "Terrasse", type: "lumiere", allume: true, niveau: 100 },
    { id: "e", nom: "Volet salon", type: "volet", position: 100 }, { id: "f", nom: "Volet cuisine", type: "volet", position: 0 },
    { id: "g", nom: "Volet chambre", type: "volet", position: 40 }, { id: "h", nom: "Volet bureau", type: "volet", position: 100 }
  ];
}

/* ---------- Rechargement automatique ----------
   Le relais du NAS remplace index.html quand une nouvelle version est publiée :
   la page vérifie toutes les 30 min si elle a changé et se recharge. Rechargement aussi chaque nuit à 3h. */
var signaturePage = null;
function signature(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ":" + h; }
// Recharge avec une adresse nouvelle : l'icône d'écran d'accueil d'iOS garde sinon l'ancienne page en cache.
function recharger() { location.replace(location.pathname + "?v=" + new Date().getTime() + location.hash); }
function verifierVersion() {
  if (location.protocol === "file:" || location.hash === "#demo") return;
  var x = new XMLHttpRequest();
  x.open("GET", "index.html?v=" + new Date().getTime(), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200 || x.responseText.length < 5000) return;
    var s = signature(x.responseText);
    if (signaturePage === null) signaturePage = s;
    else if (s !== signaturePage) recharger();
  };
  try { x.send(); } catch (e) {}
}
setInterval(function () {
  var d = new Date();
  if (d.getHours() === 3 && d.getMinutes() === 0 && d.getSeconds() < 2) recharger();
}, 1000);
setInterval(verifierVersion, 30 * 60000);
verifierVersion();

/* ---------- Démarrage ---------- */
creerEtoiles();
majHorloge();
setInterval(majHorloge, 1000);
setInterval(tourner, CONFIG.secondesParInfo * 1000);
chargerMeteo();
chargerAir();
chargerFoot();
chargerInterieur();
chargerSonos();
chargerMaison();
chargerActus();
chargerAgenda();
</script>

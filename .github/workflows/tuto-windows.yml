name: Captures du tutoriel Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/tuto_win_captures.py"
      - ".github/workflows/tuto-windows.yml"

jobs:
  captures:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pywinauto pillow
      - name: Écran en 1920x1080 (si possible)
        continue-on-error: true
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Construction de MixApp.exe et de l'installateur
        shell: pwsh
        run: |
          python -m PyInstaller MixApp.spec --noconfirm --log-level WARN
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\MixApp.iss
      - name: Musique de démonstration
        shell: pwsh
        run: python tools/make_demo_tracks.py "$HOME\Music\Mes playlists"
      - name: Captures
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          python tools/tuto_win_captures.py installer\Output\MixApp-Setup-Windows.exe "$HOME\Music\Mes playlists" captures
      - name: Publication des captures (branche tuto-captures-windows)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/pub && cp -r captures/* /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b tuto-captures-windows
          git config user.name "MixApp"
          git config user.email "mixapp@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures Windows (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tuto-captures-windows

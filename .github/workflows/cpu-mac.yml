name: Mesure processeur Mac

on:
  workflow_dispatch:

jobs:
  mesure:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow psutil py-spy
      - name: Musique de démonstration et réglages
        run: |
          python tools/make_demo_tracks.py "$HOME/Music/Mes playlists"
          mkdir -p "$HOME/Library/Application Support/MixApp"
          printf '{"roots": ["%s"], "covers_online": false, "volume": 0.9}' "$HOME/Music/Mes playlists" > "$HOME/Library/Application Support/MixApp/settings.json"
      - name: "Mesure : petite fenêtre 1024x700 · fluide"
        timeout-minutes: 10
        env:
          MIXAPP_FAKE_AUDIO: "1"
        run: python tools/cpu_probe.py 20 --rapide --taille=1024x700 --mode=fluide
      - name: "Mesure : grande fenêtre 2560x1600 · fluide"
        timeout-minutes: 10
        env:
          MIXAPP_FAKE_AUDIO: "1"
        run: python tools/cpu_probe.py 20 --rapide --taille=2560x1600 --mode=fluide
      - name: "Mesure : grande fenêtre 2560x1600 · léger"
        timeout-minutes: 10
        env:
          MIXAPP_FAKE_AUDIO: "1"
        run: python tools/cpu_probe.py 20 --rapide --taille=2560x1600 --mode=leger
      - name: "Mesure : grande fenêtre 2560x1600 · fluide · vues natives"
        timeout-minutes: 10
        env:
          MIXAPP_FAKE_AUDIO: "1"
          MIXAPP_NATIVE_ANIM: "1"
        run: python tools/cpu_probe.py 20 --rapide --taille=2560x1600 --mode=fluide
      - name: "Référence : version d'avant (grande fenêtre · fluide)"
        timeout-minutes: 10
        env:
          MIXAPP_FAKE_AUDIO: "1"
        run: |
          git fetch -q --depth 5 origin 5a264b87ed01935d7140e40492277df582fcc1d3 || true
          git checkout 5a264b87ed01935d7140e40492277df582fcc1d3 -- mixapp
          python tools/cpu_probe.py 20 --rapide --taille=2560x1600 --mode=fluide

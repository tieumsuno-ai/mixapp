# Fabrique les installateurs de MixApp sur les machines de GitHub :
#   - MixApp-Mac-AppleSilicon.dmg  (Mac M1, M2, M3, M4…)
#   - MixApp-Mac-Intel.dmg         (Mac Intel, avant 2021, macOS 14 ou plus récent)
#   - MixApp-Mac-Catalina.dmg      (vieux Mac Intel : macOS 10.15 Catalina à 13)
#   - MixApp-Setup-Windows.exe
# Se lance à chaque envoi sur la branche principale, ou à la main (onglet Actions).
name: Installateurs MixApp

on:
  push:
    paths-ignore:
      - "tools/tuto_*"
      - ".github/workflows/tuto-windows.yml"
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: AppleSilicon
          - runner: macos-15-intel
            label: Intel
          - runner: macos-15-intel
            label: Catalina
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.label != 'AppleSilicon' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.label != 'Catalina'
        with:
          python-version: "3.12"
      - name: Python officiel compatible macOS 10.9+ (version Catalina)
        if: matrix.label == 'Catalina'
        run: |
          curl -fsSL -o /tmp/py.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg /tmp/py.pkg -target /
          mkdir -p "$HOME/pybin"
          ln -sf /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 "$HOME/pybin/python"
          echo "$HOME/pybin" >> "$GITHUB_PATH"
          "$HOME/pybin/python" --version
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
      - name: Bibliothèques
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.label }}" = "Catalina" ]; then
            # versions figées dont les binaires tournent encore sur macOS 10.15
            # (Qt 6.4, onnxruntime 1.16, numpy 1.26) : aucune compilation locale
            # (on télécharge les variantes « 10.x » : sinon pip prendrait les
            #  variantes macOS 14 de numpy / scipy, plus rapides mais refusées par Catalina)
            T=""; for v in 10_15 10_14 10_13 10_12 10_10 10_9; do T="$T --platform macosx_${v}_x86_64 --platform macosx_${v}_universal2"; done
            python -m pip download --only-binary=:all: $T --platform macosx_10_6_intel --python-version 3.11 \
              -r requirements-catalina.txt -d /tmp/roues
            python -m pip install --no-index --find-links /tmp/roues -r requirements-catalina.txt
          elif [ "${{ matrix.label }}" = "Intel" ]; then
            # dernières versions encore fournies toutes prêtes pour les Mac Intel
            python -m pip install "numba==0.62.1" "llvmlite==0.45.1"
            echo "numba==0.62.1" > /tmp/contraintes.txt
            echo "llvmlite==0.45.1" >> /tmp/contraintes.txt
            python -m pip install -r requirements.txt pyinstaller -c /tmp/contraintes.txt
          else
            python -m pip install -r requirements.txt pyinstaller
          fi
      - name: Vérification rapide (analyse d'un morceau de test)
        run: |
          brew install ffmpeg
          python tools/make_test_tracks.py /tmp/testmusic
          python tools/check_analysis.py /tmp/testmusic
      - name: Construction de MixApp.app
        run: |
          python -m PyInstaller MixApp.spec --noconfirm --log-level WARN
          # signature locale (« ad hoc ») de tout le paquet : obligatoire sur Mac Apple
          codesign --force --deep --sign - dist/MixApp.app
          codesign --verify --deep --strict dist/MixApp.app
      - name: Vérification Catalina (aucun binaire ne demande plus que macOS 10.15)
        if: matrix.label == 'Catalina'
        run: |
          python - <<'PY'
          import os, re, subprocess
          bad, n = [], 0
          for root, _, files in os.walk("dist/MixApp.app"):
              for f in files:
                  p = os.path.join(root, f)
                  if os.path.islink(p):
                      continue
                  with open(p, "rb") as fh:
                      magic = fh.read(4)
                  if magic not in (b"\xcf\xfa\xed\xfe", b"\xca\xfe\xba\xbe", b"\xce\xfa\xed\xfe"):
                      continue
                  out = subprocess.run(["otool", "-arch", "x86_64", "-l", p], capture_output=True, text=True).stdout
                  vers = []
                  for blk in out.split("Load command"):
                      if "LC_BUILD_VERSION" in blk:
                          vers += re.findall(r"^\s*minos (\d+)\.(\d+)", blk, re.M)
                      elif "LC_VERSION_MIN_MACOSX" in blk:
                          vers += re.findall(r"^\s*version (\d+)\.(\d+)", blk, re.M)
                  if not vers:
                      continue
                  n += 1
                  hi = max((int(a), int(b)) for a, b in vers)
                  if hi > (10, 15):
                      bad.append(f"{hi[0]}.{hi[1]}  {p}")
          print("binaires vérifiés :", n)
          print("\n".join(bad[:40]) or "tous compatibles macOS 10.15")
          raise SystemExit(1 if bad else 0)
          PY
      - name: Test des infos « le saviez-vous ? »
        timeout-minutes: 3
        continue-on-error: true
        run: dist/MixApp.app/Contents/MacOS/MixApp --cli infotest
      - name: Test de la détection du chant (modèle embarqué)
        timeout-minutes: 3
        run: dist/MixApp.app/Contents/MacOS/MixApp --cli vocaltest
      - name: Test des pochettes depuis internet (certificats HTTPS dans l'appli)
        timeout-minutes: 3
        run: dist/MixApp.app/Contents/MacOS/MixApp --cli covertest
      - name: Test de démarrage de l'appli construite (2 fois, à froid)
        run: |
          for essai in 1 2; do
          echo "===== essai $essai ====="
          rm -rf "$HOME/Library/Application Support/MixApp" "$HOME/Library/Caches/MixApp"
          mkdir -p "$HOME/Library/Application Support/MixApp"
          echo '{"roots": ["/tmp/testmusic"], "volume": 0.9}' > "$HOME/Library/Application Support/MixApp/settings.json"
          QT_QPA_PLATFORM=offscreen MIXAPP_FAKE_AUDIO=1 dist/MixApp.app/Contents/MacOS/MixApp > app.log 2>&1 &
          # on attend jusqu'à 6 min que l'appli ait analysé les morceaux de test
          python - <<'PY'
          import sqlite3, os, time
          db = os.path.expanduser("~/Library/Application Support/MixApp/library.db")
          n = 0
          for _ in range(72):
              time.sleep(5)
              if not os.path.exists(db):
                  continue
              try:
                  c = sqlite3.connect(f"file:{db}?mode=ro", uri=True, timeout=30)
                  n = c.execute("select count(*) from tracks where bpm is not null").fetchone()[0]
                  c.close()
              except Exception:
                  n = 0
              if n >= 8:
                  break
          print("morceaux analysés par l'appli construite :", n)
          open("test_result.txt", "w").write(str(n))
          PY
          kill %1 || true
          echo "----- journal de l'appli -----"; tail -60 app.log || true
          ls -la "$HOME/Library/Application Support/MixApp" || true
          test "$(cat test_result.txt)" -ge 8
          done
      - name: Image disque (.dmg)
        run: |
          mkdir dmg
          cp -R dist/MixApp.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil échoue parfois (« Resource busy ») sur les machines de GitHub : on réessaie
          for i in 1 2 3 4 5; do
            hdiutil create -volname "MixApp" -srcfolder dmg -ov -format UDZO "MixApp-Mac-${{ matrix.label }}.dmg" && break
            echo "nouvel essai dans 15 s"; sleep 15
          done
          test -f "MixApp-Mac-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: MixApp-Mac-${{ matrix.label }}
          path: MixApp-Mac-${{ matrix.label }}.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Construction de MixApp.exe
        run: python -m PyInstaller MixApp.spec --noconfirm --log-level WARN
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\MixApp.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MixApp-Windows
          path: installer/Output/MixApp-Setup-Windows.exe

  publication:
    # Publie les installateurs réussis sur la page « Releases » du dépôt
    needs: [mac, windows]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - name: Page de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la fichiers
          TAG="v0.4.${{ github.run_number }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" fichiers/* --clobber --repo "${{ github.repository }}"
            exit 0
          fi
          gh release create "$TAG" fichiers/* \
            --repo "${{ github.repository }}" \
            --title "MixApp 0.4 (version ${{ github.run_number }})" \
            --latest \
            --notes "Mac (puce Apple M1 à M4) : MixApp-Mac-AppleSilicon.dmg — ouvrir, glisser MixApp dans Applications. Au 1er lancement : Réglages Système > Confidentialité et sécurité > Ouvrir quand même.
          Mac Intel (macOS 14 ou plus) : MixApp-Mac-Intel.dmg (si présent).
          Vieux Mac Intel (macOS 10.15 Catalina à 13) : MixApp-Mac-Catalina.dmg (si présent).
          Windows : MixApp-Setup-Windows.exe — double-clic, puis suivre l'installation (si Windows affiche « Windows a protégé votre ordinateur » : Informations complémentaires > Exécuter quand même)."

